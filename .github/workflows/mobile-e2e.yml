name: Mobile E2E Testing

# Manual only. This workflow has been red since May and cannot go green from
# a workflow edit: the iOS Zig sources stopped compiling in the 0.17 migration
# (1b6f285) and need real source work — see the notes in the PR that made this
# manual. It also runs no end-to-end tests today; every step that would has an
# `if: hashFiles(...)` guard pointing at a TestApp/project that is not in the
# tree, so they all skip. Firing it on push meant a red X on unrelated commits
# for a signal nobody could act on, and two of its path filters
# (packages/zig/src/ios/**, packages/zig/src/android/**) match directories that
# do not exist at all.
on:
  workflow_dispatch:

concurrency:
  group: mobile-e2e-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ios-simulator:
    # name: iOS Simulator Tests
    runs-on: macos-14  # M1 runner for better iOS simulator performance

    steps:
      - uses: actions/checkout@v6

      - name: Setup Zig
        uses: pantry-pm/pantry/packages/action@235036fa0f48bae99b2293df5a3dc35c809b1777 # pinned: last SHA whose bundled typescript resolves on linux-x64
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Zig artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/zig
            packages/zig/.zig-cache
          key: ios-${{ runner.os }}-zig-master-${{ hashFiles('packages/zig/build.zig') }}

      - name: List available simulators
        run: |
          xcrun simctl list devices available

      - name: Boot iOS Simulator
        run: |
          # Find an iPhone 15 simulator
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 15" | head -1 | grep -oE '[0-9A-F-]{36}')

          if [ -z "$DEVICE_ID" ]; then
            # Create one if not found
            DEVICE_ID=$(xcrun simctl create "iPhone 15 Test" "iPhone 15" "iOS17.0")
          fi

          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV

          # Boot the simulator
          xcrun simctl boot "$DEVICE_ID" || true

          # Wait for simulator to finish booting. `bootstatus -b` blocks until
          # the device reaches a Booted state, eliminating the flaky fixed sleep.
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: First-party Zig dependencies
        uses: ./.github/actions/first-party-zig-deps

      - name: Build iOS library
        working-directory: packages/zig
        run: |
          # Build iOS simulator static libraries using dedicated build step
          # (not the default target which builds macOS executables)
          zig build build-ios-simulator -Doptimize=ReleaseSafe -Dmacos-sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"

      - name: First-party Zig dependencies
        uses: ./.github/actions/first-party-zig-deps

      - name: Run iOS unit tests
        working-directory: packages/zig
        run: |
          # `zig build test` reports through its exit code. The old form piped
          # it to a file and grepped for "mobile"/"ios", which fails under
          # `set -e` whenever the run is clean and the file is therefore empty.
          zig build test

      - name: Build iOS test app
        if: hashFiles('packages/ios/TestApp/TestApp.xcodeproj') != ''
        run: |
          cd packages/ios/TestApp
          xcodebuild build-for-testing \
            -scheme TestApp \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Run iOS E2E tests
        if: hashFiles('packages/ios/TestApp/TestApp.xcodeproj') != ''
        run: |
          cd packages/ios/TestApp
          xcodebuild test-without-building \
            -scheme TestApp \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -configuration Debug

      - name: Capture iOS screenshots
        run: |
          mkdir -p screenshots/ios

          # Take a screenshot of the simulator
          xcrun simctl io "$DEVICE_ID" screenshot screenshots/ios/simulator.png || true

      - name: Shutdown simulator
        if: always()
        run: |
          xcrun simctl shutdown "$DEVICE_ID" || true

      - name: Upload iOS screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: screenshots/ios/
          retention-days: 7

      - name: Generate iOS test report
        run: |
          echo "## iOS Simulator Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Simulator: iPhone 15" >> $GITHUB_STEP_SUMMARY
          echo "- iOS Version: 17.0" >> $GITHUB_STEP_SUMMARY
          echo "- Status: Completed" >> $GITHUB_STEP_SUMMARY

  android-emulator:
    # name: Android Emulator Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Zig
        uses: pantry-pm/pantry/packages/action@235036fa0f48bae99b2293df5a3dc35c809b1777 # pinned: last SHA whose bundled typescript resolves on linux-x64
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Zig artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/zig
            packages/zig/.zig-cache
          key: android-${{ runner.os }}-zig-master-${{ hashFiles('packages/zig/build.zig') }}

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: First-party Zig dependencies
        uses: ./.github/actions/first-party-zig-deps

      - name: Build Android library
        working-directory: packages/zig
        run: |
          # Use the dedicated android step, which resolves its own target.
          # Passing -Dtarget steers the *default* install step instead, which
          # builds the desktop binaries — and since an android triple reports
          # os_tag == .linux, that links GTK3/WebKit2GTK against a sysroot that
          # does not exist for Android.
          zig build build-android -Doptimize=ReleaseSafe

      - name: First-party Zig dependencies
        uses: ./.github/actions/first-party-zig-deps

      - name: Run Android unit tests
        working-directory: packages/zig
        run: |
          # `zig build test` reports through its exit code. The old form piped
          # it to a file and grepped for "mobile"/"android", which fails under
          # `set -e` whenever the run is clean and the file is therefore empty.
          zig build test

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-34-${{ runner.os }}

      - name: Create AVD and run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            echo "Emulator started"
            adb wait-for-device
            mkdir -p screenshots/android
            adb exec-out screencap -p > screenshots/android/emulator.png || true
            if [ -x "packages/android/gradlew" ]; then
              cd packages/android
              ./gradlew test
            else
              echo "Android Gradle wrapper not present; skipping project-level tests"
            fi

      - name: Upload Android screenshots
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: screenshots/android/
          retention-days: 7

      - name: Generate Android test report
        run: |
          echo "## Android Emulator Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Emulator: Pixel 6" >> $GITHUB_STEP_SUMMARY
          echo "- API Level: 34" >> $GITHUB_STEP_SUMMARY
          echo "- Status: Completed" >> $GITHUB_STEP_SUMMARY

  mobile-summary:
    # name: Mobile Test Summary
    needs: [ios-simulator, android-emulator]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## Mobile E2E Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| iOS Simulator | ${{ needs.ios-simulator.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android Emulator | ${{ needs.android-emulator.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Download all screenshots
        uses: actions/download-artifact@v4
        with:
          path: all-screenshots

      - name: Upload combined screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: all-screenshots/
          retention-days: 30
