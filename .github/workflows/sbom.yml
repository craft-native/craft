name: SBOM

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      enforce_high:
        description: Fail the release scan when High findings remain
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    # name: Generate Software Bill of Materials
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install SBOM tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/syft"
          cd "$RUNNER_TEMP/syft"
          curl --fail --location --retry 3 --output syft.tar.gz https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz
          echo 'caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d  syft.tar.gz' | sha256sum --check --strict
          tar -xzf syft.tar.gz syft
          echo "$RUNNER_TEMP/syft" >> "$GITHUB_PATH"

      - name: Generate comprehensive SBOM (Syft)
        run: |
          mkdir -p sbom
          # Generate SBOM for entire repository
          syft . -o cyclonedx-json=sbom/full-sbom.cyclonedx.json
          syft . -o spdx-json=sbom/full-sbom.spdx.json

      - name: Merge scanned and declared runtime dependencies
        run: bun scripts/merge-sbom.ts sbom

      - name: Validate SBOMs
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          bun scripts/verify-sbom.ts sbom "v$VERSION"

      - name: Generate SBOM summary
        run: |
          echo "## Software Bill of Materials (SBOM)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated Files" >> $GITHUB_STEP_SUMMARY
          echo "| File | Format | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|------|" >> $GITHUB_STEP_SUMMARY

          for file in sbom/*.json; do
            if [ -f "$file" ]; then
              SIZE=$(ls -lh "$file" | awk '{print $5}')
              NAME=$(basename "$file")
              FORMAT="CycloneDX"
              if [[ "$NAME" == *"spdx"* ]]; then FORMAT="SPDX"; fi
              echo "| $NAME | $FORMAT | $SIZE |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Component Summary" >> $GITHUB_STEP_SUMMARY

          # Count components
          if [ -f "sbom/full-sbom.cyclonedx.json" ]; then
            COMPONENTS=$(jq '.components | length' sbom/full-sbom.cyclonedx.json 2>/dev/null || echo "N/A")
            echo "- Total components: $COMPONENTS" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/
          retention-days: 90

      - name: Submit to Dependency Graph
        if: github.ref == 'refs/heads/main'
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom/github-sbom.json

  vulnerability-scan:
    needs: generate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Download SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom
          path: sbom/

      - name: Install Grype
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/grype"
          cd "$RUNNER_TEMP/grype"
          curl --fail --location --retry 3 --output grype.tar.gz https://github.com/anchore/grype/releases/download/v0.119.0/grype_0.119.0_linux_amd64.tar.gz
          echo '3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b  grype.tar.gz' | sha256sum --check --strict
          tar -xzf grype.tar.gz grype
          echo "$RUNNER_TEMP/grype" >> "$GITHUB_PATH"

      - name: Scan and validate vulnerability report
        run: bun scripts/scan-sbom.ts sbom/full-sbom.cyclonedx.json scan-results
        env:
          CRAFT_FAIL_HIGH: ${{ inputs.enforce_high || false }}

      # Always on, unlike enforce_high. Fails when a High or Critical finding is
      # not confined to paths that publish nothing, and prints the tooling
      # inventory otherwise so the count stays visible rather than silent.
      - name: Require High findings to be tooling-only
        run: bun scripts/sbom-scope.ts scan-results/vulnerabilities.json

      - name: Upload scan results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-scan
          path: scan-results/
          if-no-files-found: warn
          retention-days: 90
