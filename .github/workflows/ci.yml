name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  zig-core:
    strategy:
      # Without this, one red leg cancels the others mid-step and nobody sees a
      # result for the platforms that were fine. release.yml and
      # native-lifecycle.yml both already set it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry (provides Bun, Zig, etc.)
        uses: pantry-pm/pantry/packages/action@235036fa0f48bae99b2293df5a3dc35c809b1777 # pinned: last SHA whose bundled typescript resolves on linux-x64
        with:
          version: '0.11.64'

      - name: Verify Zig installation
        run: zig version

      - name: Cache Zig artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/zig
            packages/zig/.zig-cache
          key: ${{ runner.os }}-zig-master-${{ hashFiles('packages/zig/build.zig') }}
          restore-keys: |
            ${{ runner.os }}-zig-master-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xauth xclip dbus-x11 dunst libnotify-bin openbox wmctrl

      - name: First-party Zig dependencies
        uses: ./.github/actions/first-party-zig-deps

      - name: Build Zig core
        run: bun run build:core

      - name: Verify built native CLI startup
        run: |
          bun test ./scripts/verify-native-startup.test.ts
          VERSION="$(bun -p "require('./package.json').version")"
          bun scripts/verify-native-startup.ts packages/zig/zig-out/bin/craft "$VERSION"

      - name: Test Zig core
        working-directory: packages/zig
        run: zig build test

      - name: Verify standalone macOS signing entitlements
        if: runner.os == 'macOS'
        run: bun test ./scripts/macos-release.test.ts

      - name: Check binary size
        if: runner.os == 'Linux'
        run: |
          ls -lh packages/zig/zig-out/bin/
          size packages/zig/zig-out/bin/craft

      # The host matrix never analyzes windows.zig. Exercise the same target
      # as release.yml here so multi-window WebView2 changes cannot wait until
      # a tag to reveal a cross-compilation failure.
      - name: Cross-build Windows CLI
        if: runner.os == 'Linux'
        working-directory: packages/zig
        run: |
          VERSION="$(bun -p "require('../../package.json').version")"
          zig build -Doptimize=ReleaseSafe -Dversion="$VERSION" -Dtarget=x86_64-windows
          test -f zig-out/bin/craft.exe

      - name: Smoke Linux multi-window bridge
        if: runner.os == 'Linux'
        run: bun scripts/verify-desktop-multi-window.ts packages/zig/zig-out/bin/craft

      - name: Install SDK dependencies for packaged-app smoke
        run: bun install --frozen-lockfile

      - name: Package, install, and launch the real Craft app
        run: |
          VERSION="$(bun -p "require('./package.json').version")"
          if [ "$RUNNER_OS" = Linux ]; then
            sh scripts/run-linux-with-wm.sh bun scripts/verify-packaged-app.ts packages/zig/zig-out/bin/craft "$VERSION"
          else
            bun scripts/verify-packaged-app.ts packages/zig/zig-out/bin/craft "$VERSION"
          fi

  windows-multi-window:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry (provides Bun and Zig)
        uses: pantry-pm/pantry/packages/action@235036fa0f48bae99b2293df5a3dc35c809b1777 # pinned: last SHA whose bundled typescript resolves on linux-x64
        with:
          version: '0.11.64'

      - name: First-party Zig dependencies
        uses: ./.github/actions/first-party-zig-deps

      - name: Build Windows CLI
        shell: pwsh
        run: |
          # The Pantry .bin shim can print zig version but cannot locate Zig's
          # lib directory during a build. Run the locked package binary itself.
          $package = Join-Path $env:GITHUB_WORKSPACE 'pantry/ziglang-org/0.17.0-dev.1963_e00c6c439'
          $env:CRAFT_ZIG = ''
          foreach ($candidate in @((Join-Path $package 'zig.exe'), (Join-Path $package 'bin/zig.exe'))) {
            if (Test-Path -LiteralPath $candidate) { $env:CRAFT_ZIG = $candidate; break }
          }
          if (-not $env:CRAFT_ZIG) {
            Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'pantry') -Filter zig.exe -Recurse -File |
              Select-Object -ExpandProperty FullName
            throw "Pinned Zig executable missing from $package"
          }
          bun run build:core

      - name: Stage pinned WebView2 loader
        shell: pwsh
        run: |
          $version = '1.0.4191.47'
          $expected = 'f492bbf547d0da329553b6727435b677579b1e9f91cc9e4a1ad029366d5f23d0'
          $archive = Join-Path $env:RUNNER_TEMP 'microsoft.web.webview2.zip'
          $package = Join-Path $env:RUNNER_TEMP 'microsoft.web.webview2'
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$version/microsoft.web.webview2.$version.nupkg" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'WebView2 NuGet package digest mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $package
          Copy-Item (Join-Path $package 'build/native/x64/WebView2Loader.dll') 'packages/zig/zig-out/bin/WebView2Loader.dll'

      - name: Smoke Windows multi-window bridge
        run: bun scripts/verify-desktop-multi-window.ts packages/zig/zig-out/bin/craft.exe

      - name: Install SDK dependencies for packaged-app smoke
        run: bun install --frozen-lockfile

      - name: Locate WiX Toolset v3
        shell: pwsh
        run: |
          $wixBin = {
            Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin" -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | Select-Object -First 1
          }
          $bin = & $wixBin
          if (-not $bin) {
            choco install wixtoolset --version=3.14.1 --yes --no-progress
            $bin = & $wixBin
          }
          if (-not $bin) { throw 'WiX Toolset v3 bin directory not found' }
          $bin.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Package, install, and launch the real Craft app
        shell: pwsh
        run: |
          $version = bun -p "require('./package.json').version"
          bun scripts/verify-packaged-app.ts packages/zig/zig-out/bin/craft.exe $version

  typescript-sdk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry (provides Bun, Zig, etc.)
        uses: pantry-pm/pantry/packages/action@235036fa0f48bae99b2293df5a3dc35c809b1777 # pinned: last SHA whose bundled typescript resolves on linux-x64
        with:
          version: '0.11.64'

      - name: Install dependencies
        run: bun install

      - name: Type check TypeScript SDK
        working-directory: packages/typescript
        run: bun run typecheck

      - name: Run TypeScript SDK tests with coverage
        working-directory: packages/typescript
        run: bun test --coverage

      - name: Soak retained window routing across fresh DOM fixtures
        run: bun run test:window-routing

      - name: Generate coverage summary
        if: always()
        working-directory: packages/typescript
        run: |
          echo "## TypeScript SDK Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            cat coverage/coverage-summary.json | jq -r '.total | "- Lines: \(.lines.pct)%\n- Statements: \(.statements.pct)%\n- Functions: \(.functions.pct)%\n- Branches: \(.branches.pct)%"' >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage data not available" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build TypeScript SDK
        working-directory: packages/typescript
        run: bun run build

  # `packages/ios` had a test suite that nothing ran. That is how its
  # generator kept a defect nobody saw: `init()` read `CRAFT_IOS_RUNTIME`
  # straight from the environment, so the suite passed 12/12 in a clean shell
  # and 8/12 in a developer's, and CI never had an opinion either way.
  ios-builder:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry (provides Bun, Zig, etc.)
        uses: pantry-pm/pantry/packages/action@235036fa0f48bae99b2293df5a3dc35c809b1777 # pinned: last SHA whose bundled typescript resolves on linux-x64
        with:
          version: '0.11.64'

      - name: Install dependencies
        run: bun install

      # Unset deliberately. The suite must not depend on it, and this is the
      # job that would notice if it started to again.
      - name: Test iOS builder
        working-directory: packages/ios
        run: bun test
        env:
          CRAFT_IOS_RUNTIME: ''

      - name: Build iOS builder
        working-directory: packages/ios
        run: bun run build

  ios-native-templates:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry (provides Bun, Zig, etc.)
        uses: pantry-pm/pantry/packages/action@235036fa0f48bae99b2293df5a3dc35c809b1777 # pinned: last SHA whose bundled typescript resolves on linux-x64
        with:
          version: '0.11.64'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install dependencies
        run: bun install

      # Build generated iOS, Live Activity, and Watch targets against device
      # SDKs; build the Watch-enabled app with its Watch app embedded and
      # install it on an iOS simulator, using the watchOS simulator runtime the
      # macOS image ships (#193, #194, #195); and read the aps-environment
      # Debug and Release builds actually sign with (#196).
      - name: Compile generated iOS and Watch projects
        working-directory: packages/ios
        run: bun run test:templates
        env:
          CRAFT_IOS_RUNTIME: ''

  android-builder:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry (provides Bun, Zig, etc.)
        uses: pantry-pm/pantry/packages/action@235036fa0f48bae99b2293df5a3dc35c809b1777 # pinned: last SHA whose bundled typescript resolves on linux-x64
        with:
          version: '0.11.64'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action defaults to `tools platform-tools`, but the obsolete
          # `tools` package is no longer offered by the Android SDK repository.
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Install dependencies
        run: bun install

      - name: Test Android builder
        working-directory: packages/android
        run: bun test

      - name: Build Android builder
        working-directory: packages/android
        run: bun run build

      # Compile both the default output and the capability-heavy output. The
      # latter includes Firebase, Health Connect, and background location, so
      # conditional imports and source templates cannot hide from the compiler.
      - name: Compile generated Kotlin projects
        working-directory: packages/android
        run: bun run test:templates

  create-craft:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry (provides Bun, Zig, etc.)
        uses: pantry-pm/pantry/packages/action@235036fa0f48bae99b2293df5a3dc35c809b1777 # pinned: last SHA whose bundled typescript resolves on linux-x64
        with:
          version: '0.11.64'

      - name: Install dependencies
        run: bun install

      - name: Type check create-craft
        working-directory: packages/create-craft
        run: bun run typecheck

  ts-maps:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry (provides Bun, Zig, etc.)
        uses: pantry-pm/pantry/packages/action@235036fa0f48bae99b2293df5a3dc35c809b1777 # pinned: last SHA whose bundled typescript resolves on linux-x64
        with:
          version: '0.11.64'

      - name: Install dependencies
        run: bun install

      - name: Type check ts-maps
        working-directory: packages/ts-maps
        run: bun run typecheck

      - name: Run ts-maps tests
        working-directory: packages/ts-maps
        run: bun test

      - name: Build ts-maps
        working-directory: packages/ts-maps
        run: bun run build

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry (provides Bun, Zig, etc.)
        uses: pantry-pm/pantry/packages/action@235036fa0f48bae99b2293df5a3dc35c809b1777 # pinned: last SHA whose bundled typescript resolves on linux-x64
        with:
          version: '0.11.64'

      - name: Install dependencies
        run: bun install

      - name: Test pinned Zig toolchain selection
        run: bun test ./scripts/zig.test.ts

      - name: Check Zig formatting
        working-directory: packages/zig
        run: zig fmt --check src/ build.zig

      - name: Test failure-safe vulnerability scanning
        run: bun test ./scripts/scan-sbom.test.ts ./scripts/scan-release-artifacts.test.ts ./scripts/sbom-scope.test.ts

      - name: Audit Zig C imports
        run: bun run verify:cimports

      - name: Verify API documentation links
        run: bun run verify:docs

      - name: Test dependency-bot job selection
        run: bun test ./scripts/buddy-schedule.test.ts ./scripts/buddy-update.test.ts

      - name: Test agent environment briefing
        run: bun test ./scripts/agents-guidelines.test.ts

      - name: Test dependency advisory policy
        run: bun test ./scripts/advisory-policy.test.ts

      # Reads the registry, so this is the step that turns a newly published
      # advisory into a red build rather than a larger number in a report.
      # Clearing it is one reviewed entry in scripts/retained-advisories.ts.
      - name: Review dependency advisories
        run: bun scripts/advisory-policy.ts

      - name: Test merged SBOM inventory
        run: bun test ./scripts/merge-sbom.test.ts

      - name: Test non-mutating changelog previews
        run: bun test ./scripts/changelog-preview.test.ts

      - name: Run pickier (lint + format check)
        run: bun run lint

      - name: Test release identity validation
        run: bun test ./scripts/release-version.test.ts ./scripts/package-text.test.ts

      - name: Test complete release manifest verification
        run: bun test ./scripts/release-manifest.test.ts

      - name: Test release SBOM verification
        run: bun test ./scripts/verify-sbom.test.ts ./scripts/release-workflow.test.ts

  integration:
    runs-on: ubuntu-latest
    needs: [zig-core, typescript-sdk, create-craft, ts-maps]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry (provides Bun, Zig, etc.)
        uses: pantry-pm/pantry/packages/action@235036fa0f48bae99b2293df5a3dc35c809b1777 # pinned: last SHA whose bundled typescript resolves on linux-x64
        with:
          version: '0.11.64'

      - name: Install dependencies
        run: bun install

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: First-party Zig dependencies
        uses: ./.github/actions/first-party-zig-deps

      - name: Build Zig core
        working-directory: packages/zig
        run: zig build

      - name: Build TypeScript SDK
        working-directory: packages/typescript
        run: bun run build

      - name: Test TypeScript SDK with binary
        working-directory: packages/typescript
        run: bun test

      - name: Test ts-maps package
        working-directory: packages/ts-maps
        run: bun test

      - name: Build ts-maps package
        working-directory: packages/ts-maps
        run: bun run build

      - name: Verify publish surfaces
        run: bun run verify:packages

      - name: Test package regressions
        run: bun run test:packages

      - name: Build and verify every npm artifact
        run: bun run verify:npm

      - name: Run root verification
        run: bun run verify

  publish-commit:
    needs: [zig-core, windows-multi-window, typescript-sdk, ios-builder, ios-native-templates, android-builder, create-craft, ts-maps, lint, integration]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pantry (provides Bun, Zig, etc.)
        uses: pantry-pm/pantry/packages/action@235036fa0f48bae99b2293df5a3dc35c809b1777 # pinned: last SHA whose bundled typescript resolves on linux-x64
        with:
          version: '0.11.64'

      - name: Install Dependencies
        run: bun install

      - name: Build TypeScript SDK
        working-directory: packages/typescript
        run: bun run build

      - name: Publish Commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pantry publish:commit './packages/typescript'
        env:
          PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
