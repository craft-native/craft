name: CI

on:
  workflow_call: {}
  workflow_dispatch:
    inputs:
      software_cold_provisioning_diagnostic:
        description: Measure bounded stock Play software cold provisioning; does not run release acceptance
        type: boolean
        default: false
      software_diagnostic_virtual_cpus:
        description: Guest CPU count for the cold-provisioning diagnostic only (1 to 4)
        type: number
        default: 4
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  # A release commit's run is the one its Releaser accepts, and a group holds a
  # single pending run that any newer push replaces (cancel-in-progress does not
  # prevent that), so release commits get a group of their own: of twelve runs on
  # main, ten were dropped this way while v0.0.397 to v0.0.408 waited for theirs.
  group: "source-ci-${{ github.workflow }}-${{ inputs.software_cold_provisioning_diagnostic && 'software-cold-provisioning-diagnostic' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: release v') && github.sha) || (github.head_ref || github.ref) }}"
  # Finish Main acceptance; newer commits replace the single pending run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  browser-checkpoints:
    if: ${{ inputs.software_cold_provisioning_diagnostic != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CRAFT_TEST_BROWSER: ${{ matrix.browser }}
      CRAFT_BROWSER_ARTIFACTS: artifacts/browser-checkpoints/${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - name: Install the locked browser and system dependencies
        run: bunx --no-install playwright install --with-deps ${{ matrix.browser }}
      - name: Test real browser reload and competing-tab checkpoints
        run: bun test ./scripts/browser-checkpoints.test.ts
      - name: Retain browser identity, bundle hash, results and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checkpoints-${{ matrix.browser }}
          path: artifacts/browser-checkpoints/${{ matrix.browser }}
          if-no-files-found: error

  android-sdk-emulator:
    if: ${{ inputs.software_cold_provisioning_diagnostic != true }}
    name: Android SDK emulator
    runs-on: ubuntu-latest
    # Use the supported KVM backend for stock Play acceptance. Unaccelerated
    # TCG remains an explicit diagnostic, separate from release acceptance.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/prepare-android-disk
      - name: Enable owned runner access to KVM
        run: |
          mkdir -p artifacts/android-sdk-emulator
          id | tee artifacts/android-sdk-emulator/runner-user.txt
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          timeout 30s sudo udevadm trigger --name-match=kvm --settle
          ls -l /dev/kvm | tee artifacts/android-sdk-emulator/kvm-node.txt
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Install the managed Android toolchain
        uses: pantry-pm/pantry/packages/action@3de609e1a7e305393b3d94e2848d859b39c5b5de # v0.11.120
        with:
          version: '0.11.120'
          install: 'false'
          packages: bun.com@1.4.3 git-scm.org@2.53.0 openjdk.org@17.0.20.8 android.com/cmdline-tools@14742923.0.0
      - name: Boot and dispose the stock Play image through the SDK
        run: bun scripts/verify-android-emulator.ts
      - name: Retain emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk-emulator
          path: artifacts/android-sdk-emulator
          if-no-files-found: error

  android-software-cold-provisioning-diagnostic:
    name: Software cold provisioning diagnostic (not release acceptance)
    if: ${{ inputs.software_cold_provisioning_diagnostic == true }}
    runs-on: ubuntu-latest
    # Tool installation is separate from the at-most-1200s boot measurement.
    # This backstop includes setup, the bounded diagnostic and owned disposal.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/prepare-android-disk
      - name: Install the identical managed Android toolchain
        uses: pantry-pm/pantry/packages/action@3de609e1a7e305393b3d94e2848d859b39c5b5de # v0.11.120
        with:
          version: '0.11.120'
          install: 'false'
          packages: bun.com@1.4.3 git-scm.org@2.53.0 openjdk.org@17.0.20.8 android.com/cmdline-tools@14742923.0.0
      - name: Verify bounded budget validation and normal readiness contracts
        run: bun test ./packages/typescript/src/__tests__/android-emulator.test.ts
      - name: Measure actual stock Play software cold provisioning
        env:
          CRAFT_ANDROID_DIAGNOSTIC_FINGERPRINT: google/sdk_gphone64_x86_64/emu64xa:15/AE3A.240806.036/12592187:user/release-keys
          CRAFT_ANDROID_DIAGNOSTIC_VIRTUAL_CPUS: ${{ inputs.software_diagnostic_virtual_cpus }}
        run: bun scripts/verify-android-emulator.ts --cold-provisioning-diagnostic
      - name: Retain diagnostic identity, elapsed time, host CPU and cleanup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-software-cold-provisioning-diagnostic
          path: artifacts/android-software-cold-provisioning
          if-no-files-found: error

  vulkan-abi:
    name: Vulkan SDK ABI (${{ matrix.os }})
    if: ${{ inputs.software_cold_provisioning_diagnostic != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tools: bun.com@1.4.2 git-scm.org@2.53.0 ziglang.org@0.18.0-dev.146+35accc06e
          - os: macos-latest
            tools: bun.com@1.4.2 git-scm.org@2.53.0 ziglang.org@0.18.0-dev.146+35accc06e
          - os: windows-latest
            tools: bun.com@1.4.2 git-scm.org@2.53.0 ziglang.org@0.18.0-dev.146+35accc06e
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned ABI toolchain
        id: abi-toolchain
        uses: pantry-pm/pantry/packages/action@3de609e1a7e305393b3d94e2848d859b39c5b5de # v0.11.120
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: '0.11.120'
          install: 'false'
          packages: ${{ matrix.tools }}
      # Preserve the failing tree before a diagnostic install can change it.
      # The required setup step above still fails the job. Keep its cache key,
      # package versions and provider checks unchanged while collecting evidence.
      - name: Capture a failed native toolchain installation
        if: ${{ failure() && steps.abi-toolchain.conclusion == 'failure' }}
        env:
          PANTRY_DIAGNOSTIC_BIN: ${{ steps.abi-toolchain.outputs.pantry-path }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, lstatSync, readdirSync, readlinkSync, writeFileSync } from 'node:fs'
          import { resolve, join } from 'node:path'
          import { spawnSync } from 'node:child_process'
          const output = 'artifacts/abi-toolchain'
          mkdirSync(output, { recursive: true })
          const entries = []
          function inspect(path) {
            if (entries.length >= 50000) return
            try {
              const stat = lstatSync(path)
              entries.push({ path, mode: stat.mode, size: stat.size, link: stat.isSymbolicLink() ? readlinkSync(path) : undefined })
              if (stat.isDirectory()) for (const name of readdirSync(path).sort()) inspect(join(path, name))
            }
            catch (error) { entries.push({ path, error: error.code }) }
          }
          inspect('pantry/.bin')
          inspect('pantry/git-scm.org')
          writeFileSync(join(output, 'before-install.json'), JSON.stringify({ entries, truncated: entries.length >= 50000 }, null, 2))
          const binary = process.env.PANTRY_DIAGNOSTIC_BIN
          if (!binary) throw new Error('Failed toolchain setup did not retain its Pantry executable path')
          const result = spawnSync(resolve(binary), ['install', 'git-scm.org@2.53.0', '--no-save', '--verbose'], { encoding: 'utf8', timeout: 180000, maxBuffer: 8 * 1024 * 1024 })
          writeFileSync(join(output, 'native-install.log'), `${result.stdout ?? ''}\n${result.stderr ?? ''}`)
          writeFileSync(join(output, 'diagnostic-result.json'), JSON.stringify({ exitCode: result.status, signal: result.signal, error: result.error?.message }, null, 2))
          NODE
      - name: Retain failed native toolchain evidence
        if: ${{ failure() && steps.abi-toolchain.conclusion == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: abi-toolchain-${{ matrix.os }}
          path: artifacts/abi-toolchain
          if-no-files-found: error
      - name: Check Git is the declared Pantry provider
        id: managed-git
        run: bun scripts/managed-git.ts --verify
      - name: Check the compiler identity
        run: test "$(zig version)" = '0.18.0-dev.146+35accc06e'
      - name: Install the native Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: First-party Zig dependencies
        uses: ./.github/actions/first-party-zig-deps
      - name: Run the documented public graphics package consumer
        run: bun scripts/verify-zig-package-consumer.ts
      - name: Check out the exact Khronos SDK headers
        run: |
          bun scripts/managed-git.ts init .zig-cache/vulkan-headers
          bun scripts/managed-git.ts -C .zig-cache/vulkan-headers remote add origin https://github.com/KhronosGroup/Vulkan-Headers.git
          bun scripts/managed-git.ts -C .zig-cache/vulkan-headers fetch --depth 1 origin 6802bb4733b63ed5efd3adb308a6c885ef180ea1 # vulkan-sdk-1.4.363.0
          bun scripts/managed-git.ts -C .zig-cache/vulkan-headers checkout --detach FETCH_HEAD
          test "$(bun scripts/managed-git.ts -C .zig-cache/vulkan-headers rev-parse HEAD)" = 6802bb4733b63ed5efd3adb308a6c885ef180ea1
      - name: Execute the independent SDK ABI probe and C callback
        working-directory: packages/zig
        run: |
          VULKAN_HEADERS="$(bun -p "require('node:path').resolve('../../.zig-cache/vulkan-headers/include')")"
          zig build test:vulkan-abi -Dvulkan-headers="$VULKAN_HEADERS" --summary all
      - name: Compile Android Vulkan adapter branches (not device acceptance)
        if: runner.os == 'Linux'
        working-directory: packages/zig
        run: |
          zig test src/vulkan_surface.zig -target aarch64-linux-android -lc -fno-emit-bin
          zig test src/vulkan_surface.zig -target x86_64-linux-android -lc -fno-emit-bin

  zig-core:
    if: ${{ inputs.software_cold_provisioning_diagnostic != true }}
    strategy:
      # Without this, one red leg cancels the others mid-step and nobody sees a
      # result for the platforms that were fine. release.yml and
      # native-lifecycle.yml both already set it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry (provides Bun, Zig, etc.)
        uses: pantry-pm/pantry/packages/action@3de609e1a7e305393b3d94e2848d859b39c5b5de # v0.11.120
        with:
          version: '0.11.120'

      - name: Verify Zig installation
        run: zig version

      - name: Cache Zig artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/zig
            packages/zig/.zig-cache
          key: ${{ runner.os }}-zig-master-${{ hashFiles('packages/zig/build.zig') }}
          restore-keys: |
            ${{ runner.os }}-zig-master-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xauth xclip dbus-x11 dunst libnotify-bin openbox wmctrl x11-utils libvulkan1 mesa-vulkan-drivers vulkan-tools vulkan-validationlayers libxtst-dev

      - name: First-party Zig dependencies
        uses: ./.github/actions/first-party-zig-deps

      - name: Build Zig core
        run: bun run build:core

      - name: Verify built native CLI startup
        run: |
          bun test ./scripts/verify-native-startup.test.ts
          VERSION="$(bun -p "require('./package.json').version")"
          bun scripts/verify-native-startup.ts packages/zig/zig-out/bin/craft "$VERSION"

      # Hundreds of native test executables compete for the same small runner.
      # Bound their fanout so the IPC runner stays responsive under compilation.
      - name: Test Zig core
        working-directory: packages/zig
        run: zig build test -j2

      - name: Verify native eval diagnostics through the public CLI
        env:
          CRAFT_NATIVE_TEST_BIN: ${{ github.workspace }}/packages/zig/zig-out/bin/craft
        run: bun test ./scripts/native-eval.test.ts

      - name: Verify runtime-disabled native eval classification
        run: |
          bun scripts/zig.ts --core --versioned build -Doptimize=ReleaseSafe -Djs-runtime=false --prefix .zig-cache/eval-no-runtime
          bun scripts/zig.ts --core build test-js-runtime -Djs-runtime=false
          CRAFT_NATIVE_TEST_BIN="$PWD/packages/zig/.zig-cache/eval-no-runtime/bin/craft" CRAFT_NATIVE_TEST_UNAVAILABLE=1 bun test ./scripts/native-eval.test.ts

      - name: Verify native bridge boundaries and background deadlines
        if: runner.os == 'macOS'
        env:
          CRAFT_NATIVE_TEST_BIN: ${{ github.workspace }}/packages/zig/zig-out/bin/craft
        run: bun test ./packages/typescript/src/__tests__/bridge-origin.native.test.ts ./packages/typescript/src/__tests__/bridge-timers.native.test.ts ./packages/typescript/src/__tests__/menubar-visibility.native.test.ts

      - name: Verify standalone macOS signing entitlements
        if: runner.os == 'macOS'
        run: bun test ./scripts/macos-release.test.ts

      - name: Verify AppKit component layout and controls
        if: runner.os == 'macOS'
        run: bun test ./packages/macos/src/renderer.test.ts

      - name: Verify WebKit inspection and distribution capabilities natively
        if: runner.os == 'macOS'
        run: |
          bun scripts/zig.ts --core --versioned build test:webkit-public -Djs-runtime=false -Dprivate-apis=false
          bun scripts/zig.ts --core --versioned build test:webkit-public -Djs-runtime=false

      - name: Check binary size
        if: runner.os == 'Linux'
        run: |
          ls -lh packages/zig/zig-out/bin/
          size packages/zig/zig-out/bin/craft

      # The host matrix never analyzes windows.zig. Exercise the same target
      # as release.yml here so multi-window WebView2 changes cannot wait until
      # a tag to reveal a cross-compilation failure.
      - name: Cross-build Windows CLI
        if: runner.os == 'Linux'
        working-directory: packages/zig
        run: |
          VERSION="$(bun -p "require('../../package.json').version")"
          zig build -Doptimize=ReleaseSafe -Dversion="$VERSION" -Dtarget=x86_64-windows
          test -f zig-out/bin/craft.exe

      - name: Smoke Linux multi-window bridge
        if: runner.os == 'Linux'
        run: bun scripts/verify-desktop-multi-window.ts packages/zig/zig-out/bin/craft

      - name: Install SDK dependencies for packaged-app smoke
        run: bun install --frozen-lockfile

      - name: Package, install, and launch the real Craft app
        run: |
          VERSION="$(bun -p "require('./package.json').version")"
          if [ "$RUNNER_OS" = Linux ]; then
            sh scripts/run-linux-with-wm.sh bun scripts/verify-packaged-app.ts packages/zig/zig-out/bin/craft "$VERSION"
          else
            bun scripts/verify-packaged-app.ts packages/zig/zig-out/bin/craft "$VERSION"
          fi

      - name: Verify displayed Xlib Vulkan scene frames
        if: runner.os == 'Linux'
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: bun scripts/test-vulkan-surface-linux.ts --output artifacts/native-vulkan-linux

      - name: Retain native Linux Vulkan display evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-vulkan-surface
          path: artifacts/native-vulkan-linux
          if-no-files-found: error

      - name: Install the pinned native display fixture generator
        if: matrix.os == 'macos-latest'
        uses: pantry-pm/pantry/packages/action@3de609e1a7e305393b3d94e2848d859b39c5b5de # v0.11.120
        with:
          version: '0.11.120'
          install: 'false'
          packages: github.com/yonaskolb/XcodeGen@2.46.0

      - name: Verify displayed AppKit Metal frames
        if: matrix.os == 'macos-latest'
        run: >-
          bun scripts/test-metal-surface-macos.ts
          --xcodegen "$PWD/pantry/.bin/xcodegen"
          --output artifacts/native-metal-macos

      - name: Retain native macOS Metal display evidence
        if: always() && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-metal-surface
          path: artifacts/native-metal-macos
          if-no-files-found: error
          retention-days: 30

  windows-multi-window:
    if: ${{ inputs.software_cold_provisioning_diagnostic != true }}
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry (provides Bun and Zig)
        uses: pantry-pm/pantry/packages/action@3de609e1a7e305393b3d94e2848d859b39c5b5de # v0.11.120
        with:
          version: '0.11.120'

      - name: First-party Zig dependencies
        uses: ./.github/actions/first-party-zig-deps

      - name: Build Windows CLI
        # scripts/zig.ts resolves the actual managed binary from pantry.lock,
        # including its adjacent standard library on Windows.
        run: bun run build:core

      - name: Verify pinned compiler core project selection
        if: ${{ !cancelled() }}
        run: bun scripts/verify-zig-core-project.ts

      - name: Stage pinned WebView2 loader
        shell: pwsh
        run: |
          $version = '1.0.4191.47'
          $expected = 'f492bbf547d0da329553b6727435b677579b1e9f91cc9e4a1ad029366d5f23d0'
          $archive = Join-Path $env:RUNNER_TEMP 'microsoft.web.webview2.zip'
          $package = Join-Path $env:RUNNER_TEMP 'microsoft.web.webview2'
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$version/microsoft.web.webview2.$version.nupkg" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'WebView2 NuGet package digest mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $package
          Copy-Item (Join-Path $package 'build/native/x64/WebView2Loader.dll') 'packages/zig/zig-out/bin/WebView2Loader.dll'

      - name: Smoke Windows multi-window bridge
        run: bun scripts/verify-desktop-multi-window.ts packages/zig/zig-out/bin/craft.exe

      - name: Install SDK dependencies for packaged-app smoke
        run: bun install --frozen-lockfile

      - name: Locate WiX Toolset v3
        shell: pwsh
        run: |
          $wixBin = {
            Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin" -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | Select-Object -First 1
          }
          $bin = & $wixBin
          if (-not $bin) {
            choco install wixtoolset --version=3.14.1 --yes --no-progress
            $bin = & $wixBin
          }
          if (-not $bin) { throw 'WiX Toolset v3 bin directory not found' }
          $bin.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Package, install, and launch the real Craft app
        shell: pwsh
        run: |
          $version = bun -p "require('./package.json').version"
          bun scripts/verify-packaged-app.ts packages/zig/zig-out/bin/craft.exe $version

  windows-native-vulkan:
    if: ${{ inputs.software_cold_provisioning_diagnostic != true }}
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Setup the pinned native toolchain
        uses: pantry-pm/pantry/packages/action@3de609e1a7e305393b3d94e2848d859b39c5b5de # v0.11.120
        with:
          version: '0.11.120'

      - name: Compile the first-party Windows Job Object owner
        shell: pwsh
        run: |
          if ((zig version).Trim() -ne '0.18.0-dev.146+35accc06e') { throw 'Unexpected native compiler' }
          $owner = Join-Path $env:RUNNER_TEMP 'craft-native-windows-owner.exe'
          zig cc -target x86_64-windows-gnu -O2 -municode scripts/native/windows-command-owner.c -o $owner
          if ($LASTEXITCODE -ne 0) { throw 'Native command owner compilation failed' }
          "CRAFT_NATIVE_WINDOWS_COMMAND_OWNER=$owner" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify the declared native Git provider
        shell: pwsh
        run: bun scripts/managed-git.ts --verify

      - name: Verify actual native command ownership
        shell: pwsh
        run: |
          bun test ./scripts/native/windows-command.test.ts 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'native-windows-command-tests.log')
          if ($LASTEXITCODE -ne 0) { throw 'Native command ownership verification failed' }

      # A cold SwiftShader build (its LLVM backend included) runs close to its
      # 30-minute command budget on hosted runners, and timed out in 0.0.406.
      # Keep the loader and ICD built from the pinned sources; the script
      # reuses them only for the same sources, script, CMake and Visual Studio,
      # and verifies every byte against the recorded hashes.
      # Keyed on the toolchain rather than the runner image: hosted runners
      # roll out images gradually, and two image versions served one run.
      - name: Identify the Windows Vulkan driver toolchain
        id: vulkan-toolchain
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $visualStudio = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion | Select-Object -First 1).Trim()
          $cmake = ((cmake --version | Select-Object -First 1) -replace '[^0-9.]', '')
          if (-not $visualStudio -or -not $cmake) { throw 'Cannot identify the Visual Studio and CMake toolchain' }
          "key=vs$visualStudio-cmake$cmake" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore the source-built Windows Vulkan driver
        id: vulkan-driver-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/craft-windows-vulkan-driver
          key: windows-vulkan-driver-${{ steps.vulkan-toolchain.outputs.key }}-${{ hashFiles('scripts/native/windows-vulkan-driver.ts') }}

      - name: Verify displayed Win32 Vulkan scene frames
        shell: pwsh
        env:
          CRAFT_WINDOWS_VULKAN_DRIVER_CACHE: ${{ runner.temp }}/craft-windows-vulkan-driver
        run: bun scripts/test-vulkan-surface-windows.ts --owner "$env:CRAFT_NATIVE_WINDOWS_COMMAND_OWNER" --output artifacts/native-vulkan-windows

      - name: Check for a newly built Windows Vulkan driver
        id: vulkan-driver-built
        if: ${{ always() && steps.vulkan-driver-cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: '"present=$(Test-Path (Join-Path $env:RUNNER_TEMP ''craft-windows-vulkan-driver/driver.json''))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append'

      - name: Keep the source-built Windows Vulkan driver
        if: ${{ always() && steps.vulkan-driver-built.outputs.present == 'True' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/craft-windows-vulkan-driver
          key: ${{ steps.vulkan-driver-cache.outputs.cache-primary-key }}

      - name: Retain native Win32 Vulkan display evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-vulkan-surface
          path: artifacts/native-vulkan-windows
          if-no-files-found: error

      - name: Retain original Windows command ownership results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-command-ownership
          path: ${{ runner.temp }}/native-windows-command-tests.log
          if-no-files-found: error

  typescript-sdk:
    if: ${{ inputs.software_cold_provisioning_diagnostic != true }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry (provides Bun, Zig, etc.)
        uses: pantry-pm/pantry/packages/action@3de609e1a7e305393b3d94e2848d859b39c5b5de # v0.11.120
        with:
          version: '0.11.120'

      - name: Install dependencies
        run: bun install

      - name: Type check TypeScript SDK
        working-directory: packages/typescript
        run: bun run typecheck

      - name: Run TypeScript SDK tests with coverage
        working-directory: packages/typescript
        run: bun test --coverage

      - name: Soak retained window routing across fresh DOM fixtures
        run: bun run test:window-routing

      - name: Generate coverage summary
        if: always()
        working-directory: packages/typescript
        run: |
          echo "## TypeScript SDK Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            cat coverage/coverage-summary.json | jq -r '.total | "- Lines: \(.lines.pct)%\n- Statements: \(.statements.pct)%\n- Functions: \(.functions.pct)%\n- Branches: \(.branches.pct)%"' >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage data not available" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build TypeScript SDK
        working-directory: packages/typescript
        run: bun run build

  # `packages/ios` had a test suite that nothing ran. That is how its
  # generator kept a defect nobody saw: `init()` read `CRAFT_IOS_RUNTIME`
  # straight from the environment, so the suite passed 12/12 in a clean shell
  # and 8/12 in a developer's, and CI never had an opinion either way.
  ios-builder:
    if: ${{ inputs.software_cold_provisioning_diagnostic != true }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry (provides Bun, Zig, etc.)
        uses: pantry-pm/pantry/packages/action@3de609e1a7e305393b3d94e2848d859b39c5b5de # v0.11.120
        with:
          version: '0.11.120'

      - name: Install dependencies
        run: bun install

      # Unset deliberately. The suite must not depend on it, and this is the
      # job that would notice if it started to again.
      - name: Test iOS builder
        working-directory: packages/ios
        run: bun test
        env:
          CRAFT_IOS_RUNTIME: ''

      - name: Build iOS builder
        working-directory: packages/ios
        run: bun run build

  ios-native-templates:
    if: ${{ inputs.software_cold_provisioning_diagnostic != true }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry (provides Bun, Zig, etc.)
        uses: pantry-pm/pantry/packages/action@3de609e1a7e305393b3d94e2848d859b39c5b5de # v0.11.120
        with:
          version: '0.11.120'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install dependencies
        run: bun install

      - name: Test Swift launch and queued native link lifecycle
        working-directory: packages/ios
        run: bun test ./src/launch-link-state.test.ts

      - name: Test public recording frame provenance
        working-directory: packages/ios
        run: bun test ./src/held-viewer-video.test.ts ./src/held-viewer-extractor.test.ts

      # Build generated iOS, Live Activity, and Watch targets against device
      # SDKs; build the Watch-enabled app with its Watch app embedded and
      # install it on an iOS simulator, using the watchOS simulator runtime the
      # macOS image ships (#193, #194, #195); and read the aps-environment
      # Debug and Release builds actually sign with (#196).
      - name: Compile generated iOS and Watch projects
        working-directory: packages/ios
        run: bun run test:templates
        env:
          CRAFT_IOS_RUNTIME: ''
          CRAFT_IOS_TEMPLATE_EVIDENCE: ${{ github.workspace }}/artifacts/ios-template-compilation

      - name: Retain native template XCTest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-template-compilation
          path: artifacts/ios-template-compilation
          if-no-files-found: warn

  android-builder:
    if: ${{ inputs.software_cold_provisioning_diagnostic != true }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry (provides Bun, Zig, etc.)
        uses: pantry-pm/pantry/packages/action@3de609e1a7e305393b3d94e2848d859b39c5b5de # v0.11.120
        with:
          version: '0.11.120'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action defaults to `tools platform-tools`, but the obsolete
          # `tools` package is no longer offered by the Android SDK repository.
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Install dependencies
        run: bun install

      - name: Test Android builder
        working-directory: packages/android
        run: bun test

      - name: Build Android builder
        working-directory: packages/android
        run: bun run build

      # Compile both the default output and the capability-heavy output. The
      # latter includes Firebase, Health Connect, and background location, so
      # conditional imports and source templates cannot hide from the compiler.
      - name: Compile generated Kotlin projects
        working-directory: packages/android
        run: bun run test:templates

  create-craft:
    if: ${{ inputs.software_cold_provisioning_diagnostic != true }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry (provides Bun, Zig, etc.)
        uses: pantry-pm/pantry/packages/action@3de609e1a7e305393b3d94e2848d859b39c5b5de # v0.11.120
        with:
          version: '0.11.120'

      - name: Install dependencies
        run: bun install

      - name: Type check create-craft
        working-directory: packages/create-craft
        run: bun run typecheck

  ts-maps:
    if: ${{ inputs.software_cold_provisioning_diagnostic != true }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry (provides Bun, Zig, etc.)
        uses: pantry-pm/pantry/packages/action@3de609e1a7e305393b3d94e2848d859b39c5b5de # v0.11.120
        with:
          version: '0.11.120'

      - name: Install dependencies
        run: bun install

      - name: Type check ts-maps
        working-directory: packages/ts-maps
        run: bun run typecheck

      - name: Run ts-maps tests
        working-directory: packages/ts-maps
        run: bun test

      - name: Build ts-maps
        working-directory: packages/ts-maps
        run: bun run build

  lint:
    if: ${{ inputs.software_cold_provisioning_diagnostic != true }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry (provides Bun, Zig, etc.)
        uses: pantry-pm/pantry/packages/action@3de609e1a7e305393b3d94e2848d859b39c5b5de # v0.11.120
        with:
          version: '0.11.120'

      - name: Install dependencies
        run: bun install

      - name: Test pinned Zig toolchain selection
        run: bun test ./scripts/zig.test.ts

      - name: Check Zig formatting
        working-directory: packages/zig
        run: zig fmt --check src/ build.zig

      - name: Test failure-safe vulnerability scanning
        run: bun test ./scripts/scan-sbom.test.ts ./scripts/scan-release-artifacts.test.ts ./scripts/sbom-scope.test.ts

      - name: Audit Zig C imports
        run: bun run verify:cimports

      - name: Verify API documentation links
        run: bun run verify:docs

      - name: Test host-neutral native renderer contract
        run: bun test ./scripts/native-renderer-contract.test.ts

      - name: Test native Windows C++ toolchain discovery
        run: bun test ./scripts/native/windows-vulkan-driver.test.ts

      - name: Test multi-window event delivery policy
        run: bun test ./scripts/multi-window-event-policy.test.ts

      - name: Test iOS validation conformance table
        run: bun test ./scripts/ios-validation-conformance.test.ts

      - name: Test Windows WebView2 COM contract
        run: bun test ./scripts/windows-webview2-contract.test.ts

      - name: Test dependency-bot job selection
        run: bun test ./scripts/buddy-schedule.test.ts ./scripts/buddy-update.test.ts

      - name: Test software-provisioning diagnostic isolation
        run: bun test ./scripts/software-provisioning-profile.test.ts

      - name: Test agent environment briefing
        run: bun test ./scripts/agents-guidelines.test.ts

      - name: Test dependency advisory policy
        run: bun test ./scripts/advisory-policy.test.ts

      # Reads the registry, so this is the step that turns a newly published
      # advisory into a red build rather than a larger number in a report.
      # Clearing it is one reviewed entry in scripts/retained-advisories.ts.
      - name: Review dependency advisories
        run: bun scripts/advisory-policy.ts

      - name: Test merged SBOM inventory
        run: bun test ./scripts/merge-sbom.test.ts

      - name: Test non-mutating changelog previews
        run: bun test ./scripts/changelog-preview.test.ts

      - name: Test installed-app smoke checkpoints
        run: bun test ./scripts/verify-packaged-app.test.ts

      - name: Test native Metal suite admission
        run: bun test ./packages/ios/scripts/metal-xctest-steps.test.ts

      - name: Run pickier (lint + format check)
        run: bun run lint

      - name: Test release identity validation
        run: bun test ./scripts/release-version.test.ts ./scripts/package-text.test.ts

      - name: Test complete release manifest verification
        run: bun test ./scripts/release-manifest.test.ts

      - name: Test release SBOM verification
        run: bun test ./scripts/verify-sbom.test.ts ./scripts/release-workflow.test.ts ./scripts/managed-java-home.test.ts

  integration:
    if: ${{ inputs.software_cold_provisioning_diagnostic != true }}
    runs-on: ubuntu-latest
    needs: [zig-core, typescript-sdk, create-craft, ts-maps]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry (provides Bun, Zig, etc.)
        uses: pantry-pm/pantry/packages/action@3de609e1a7e305393b3d94e2848d859b39c5b5de # v0.11.120
        with:
          version: '0.11.120'

      - name: Install dependencies
        run: bun install

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: First-party Zig dependencies
        uses: ./.github/actions/first-party-zig-deps

      - name: Build Zig core
        working-directory: packages/zig
        run: zig build

      - name: Build TypeScript SDK
        working-directory: packages/typescript
        run: bun run build

      - name: Test TypeScript SDK with binary
        working-directory: packages/typescript
        run: bun test

      - name: Test ts-maps package
        working-directory: packages/ts-maps
        run: bun test

      - name: Build ts-maps package
        working-directory: packages/ts-maps
        run: bun run build

      - name: Verify publish surfaces
        run: bun run verify:packages

      - name: Test package regressions
        run: bun run test:packages

      - name: Build and verify every npm artifact
        run: bun run verify:npm

      - name: Run root verification
        run: bun run verify

  publish-commit:
    if: ${{ inputs.software_cold_provisioning_diagnostic != true }}
    needs: [browser-checkpoints, android-sdk-emulator, zig-core, windows-multi-window, windows-native-vulkan, typescript-sdk, ios-builder, ios-native-templates, android-builder, create-craft, ts-maps, lint, integration]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pantry (provides Bun, Zig, etc.)
        uses: pantry-pm/pantry/packages/action@3de609e1a7e305393b3d94e2848d859b39c5b5de # v0.11.120
        with:
          version: '0.11.120'

      - name: Install Dependencies
        run: bun install

      - name: Build TypeScript SDK
        working-directory: packages/typescript
        run: bun run build

      - name: Publish Commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pantry publish:commit './packages/typescript'
        env:
          PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
