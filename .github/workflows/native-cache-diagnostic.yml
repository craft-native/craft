name: Diagnose managed native cache

# Manual provisioning replay only. This workflow cannot qualify a release.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  replay:
    runs-on: macos-15
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      NATIVE_DIAGNOSTIC_CACHE_KEY: pantry-v4-0.11.113-darwin-arm64-98164eb4591c9bbeef1daea138be64cb22a7b38254d41073bd933b9b9cc86923-2578f74743fd738840746ab4bfed0548fe092a9d8802ef8ff5400fcc022db98c-d105178aaea0807b4c81818a43ae2c64efe72af8d1a072cb659aad4ddb6b85cb-bun.com@1.4.3 git-scm.org@2.53.0 ziglang.org@0.18.0-dev.146+35accc06e github.com/yonaskolb/XcodeGen@2.46.0
    steps:
      - uses: actions/checkout@v6
      - name: Obtain the original Pantry CLI
        id: pantry
        uses: pantry-pm/pantry/packages/action@530408c77647750a68877773a3ea6165e5dc6281 # v0.11.166
        with:
          version: '0.11.166'
          install: 'false'
      - name: Restore the exact failed cache without replacing it
        uses: actions/cache/restore@v5
        with:
          # Cache versions include the literal path. The Pantry action saves
          # this absolute path, so a relative spelling cannot restore it.
          path: ${{ github.workspace }}/pantry
          key: ${{ env.NATIVE_DIAGNOSTIC_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Inspect and replay the native resolver
        env:
          PANTRY_DIAGNOSTIC_CLI: ${{ steps.pantry.outputs.pantry-path }}
        run: |
          export PATH="$PWD/pantry/.bin:$PATH"
          "$PWD/pantry/.bin/bun" scripts/diagnose-native-cache.ts "$PANTRY_DIAGNOSTIC_CLI" artifacts/native-cache-diagnostic 100
      - name: Restore the original tree before the complete action replay
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/pantry
          key: ${{ env.NATIVE_DIAGNOSTIC_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Replay the complete original managed tool setup
        uses: pantry-pm/pantry/packages/action@530408c77647750a68877773a3ea6165e5dc6281 # v0.11.166
        env:
          PANTRY_VERBOSE: '1'
        with:
          version: '0.11.166'
          install: 'false'
          packages: bun.com@1.4.3 git-scm.org@2.53.0 ziglang.org@0.18.0-dev.146+35accc06e github.com/yonaskolb/XcodeGen@2.46.0
      - name: Retain bounded provisioning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-cache-diagnostic
          path: artifacts/native-cache-diagnostic
          if-no-files-found: error
          retention-days: 14
