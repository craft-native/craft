name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  validate-release:
    name: validate release identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Validate tag and workspace versions
        run: bun scripts/release-version.ts

      # A release must not carry an advisory nobody has reviewed, or a review
      # that expired while the release was being prepared.
      - name: Review dependency advisories
        run: bun scripts/advisory-policy.ts

  release-sbom:
    needs: validate-release
    uses: ./.github/workflows/sbom.yml
    with:
      # Keep the full-source report for review. The High gate runs against
      # the artifacts and production dependencies prepared for publication.
      enforce_high: false

  pantry:
    # The reusable SBOM workflow includes the vulnerability scan. Publishing
    # must wait for its existing Critical gate, not merely attach it afterward.
    needs: [validate-release, release-sbom]
    name: pantry (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: macos-26, name: darwin-arm64, deps: '' }
          - { os: ubuntu-latest, name: linux-x86-64, deps: 'sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev' }
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: write
      id-token: write
    env:
      # Pinned, not inherited from the runner. `zig build` with no -Dtarget
      # builds for the host, which sets the deployment target to the build
      # machine's own OS version — that is how the published binary came to
      # demand macOS 15.7.7 while PLATFORMS.md advertised 10.15. 15.0 is the
      # floor the last release actually had, rounded down to the release
      # itself, so nothing that runs craft today stops.
      DEPLOYMENT_TARGET: '15.0'
      ARM64_TARGET: aarch64-macos.15.0
      X64_TARGET: x86_64-macos.15.0
      # macOS 26 is where the window controls were restyled.
      SDK_FLOOR: '26'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pantry (provides Bun, Zig, etc.)
        uses: pantry-pm/pantry/packages/action@e0e7377f6f94f1348b8efcfd3e631967261c6dce # v0.11.66
        with:
          version: '0.11.64'

      - name: Install System Dependencies
        if: matrix.platform.deps != ''
        run: ${{ matrix.platform.deps }}

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Extract Version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: First-party Zig dependencies
        uses: ./.github/actions/first-party-zig-deps

      - name: Build Native Binary
        run: bun run build:core

      # ── Cross-compile all targets ────────────────────────────────
      - name: Cross-compile additional targets (macOS)
        if: runner.os == 'macOS'
        working-directory: packages/zig
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SDK_PATH="$(xcrun --show-sdk-path)"
          mkdir -p zig-out/cross

          echo "::group::Cross-compile darwin-x64"
          zig build -Doptimize=ReleaseSafe -Dversion="$VERSION" -Dtarget="$X64_TARGET" -Dmacos-sdk="$SDK_PATH"
          mkdir -p zig-out/cross/darwin-x64 && cp zig-out/bin/craft zig-out/cross/darwin-x64/craft
          echo "::endgroup::"

          # Restore native ARM64 binary. `zig-out/bin` is cleared first because
          # the publish step zips that directory whole and unfiltered, so
          # anything a cross build left in it ships to users under the host's
          # archive name.
          # `-Dmacos-sdk` is not optional once `-Dtarget` is given, even for
          # the host's own architecture: naming a target puts Zig in
          # cross-compilation mode, where it stops looking for the system SDK
          # on its own and every `-framework Cocoa` fails to resolve.
          rm -rf zig-out/bin
          zig build -Doptimize=ReleaseSafe -Dversion="$VERSION" -Dtarget="$ARM64_TARGET" -Dmacos-sdk="$SDK_PATH"

      # AppKit decides how it draws a window's controls from the SDK recorded
      # in LC_BUILD_VERSION, so that it can restyle them without restyling
      # every app built before the change. macOS 26 restyled the traffic
      # lights. A binary built against an older SDK therefore draws last
      # year's, and no downstream app embedding this runtime can override it —
      # this job is the only place it can be fixed.
      #
      # Assert it rather than trust the runner label: an image bump or a
      # changed Xcode default would otherwise put the old buttons back with
      # nothing in the log to say so.
      - name: Verify macOS binaries opt into the current appearance
        if: runner.os == 'macOS'
        working-directory: packages/zig
        run: |
          check() {
            local binary="$1"
            local build_version
            build_version="$(otool -l "$binary" | grep -A 4 LC_BUILD_VERSION)"
            local sdk minos
            sdk="$(echo "$build_version" | awk '/sdk/ { print $2 }')"
            minos="$(echo "$build_version" | awk '/minos/ { print $2 }')"
            echo "$binary: minos=$minos sdk=$sdk"

            if [ "${sdk%%.*}" -lt "$SDK_FLOOR" ]; then
              echo "::error::$binary is linked against the macOS $sdk SDK; $SDK_FLOOR or newer is required for the current window controls." >&2
              exit 1
            fi
            # A deployment target that tracks the build machine is how the
            # floor silently became 15.7.7 while the docs said 10.15.
            if [ "$minos" != "$DEPLOYMENT_TARGET" ]; then
              echo "::error::$binary declares minos=$minos, expected $DEPLOYMENT_TARGET." >&2
              exit 1
            fi
          }

          check zig-out/bin/craft
          check zig-out/cross/darwin-x64/craft

      - name: Cross-compile additional targets (Linux)
        if: runner.os == 'Linux'
        working-directory: packages/zig
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p zig-out/cross

          # Only cross-compile targets that do not require a target sysroot.
          # Linux/FreeBSD GUI builds link GTK/WebKit system libraries, so
          # non-host triples need dedicated sysroots before they are reliable.
          for target_spec in \
            "x86_64-windows:windows-x64:craft.exe"; do
            IFS=: read -r zig_target dir_name bin_name <<< "$target_spec"
            echo "::group::Cross-compile $dir_name"
            zig build -Doptimize=ReleaseSafe -Dversion="$VERSION" -Dtarget="$zig_target"
            mkdir -p "zig-out/cross/$dir_name" && cp "zig-out/bin/$bin_name" "zig-out/cross/$dir_name/$bin_name"
            echo "Built $dir_name"
            echo "::endgroup::"
          done

          # Restore native linux-x64 binary. Clearing `zig-out/bin` first is
          # load-bearing: the windows cross build above leaves craft.exe there,
          # nothing removes it, and the publish step zips the whole directory —
          # so craft-linux-x64.zip shipped a Windows PE binary alongside the
          # Linux one.
          rm -rf zig-out/bin
          zig build -Doptimize=ReleaseSafe -Dversion="$VERSION"

      # The Windows binary dynamically loads WebView2Loader.dll. The runtime
      # alone does not provide the app-local loader, so stage the x64 DLL beside
      # craft.exe before Pantry zips zig-out/cross/windows-x64/. Pin and verify
      # the official NuGet package instead of silently shipping a moving DLL.
      - name: Stage Windows WebView2 loader
        if: runner.os == 'Linux'
        working-directory: packages/zig
        run: |
          set -euo pipefail
          VERSION=1.0.4191.47
          EXPECTED=f492bbf547d0da329553b6727435b677579b1e9f91cc9e4a1ad029366d5f23d0
          ARCHIVE="$RUNNER_TEMP/microsoft.web.webview2.$VERSION.nupkg"
          curl -fsSL --retry 3 "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$VERSION/microsoft.web.webview2.$VERSION.nupkg" -o "$ARCHIVE"
          echo "$EXPECTED  $ARCHIVE" | sha256sum -c -
          unzip -p "$ARCHIVE" build/native/x64/WebView2Loader.dll > zig-out/cross/windows-x64/WebView2Loader.dll
          test -s zig-out/cross/windows-x64/WebView2Loader.dll

      # ── macOS Code Signing & Notarization ──────────────────────────
      # The signing credentials live encrypted in `.env.production`, not as
      # seven repository secrets.
      #
      # One key instead of seven values: the ciphertext is committed and
      # reviewable, rotating a certificate is a commit rather than seven trips
      # through a settings page, and the same file works locally — `buddy
      # env:get` reads a value on a laptop with no GitHub involved.
      # What that trades away
      # is that the ciphertext is public, so the whole of the secrecy is
      # `DOTENV_PRIVATE_KEY_PRODUCTION`, which is the one thing that stays a
      # repository secret.
      #
      # Decrypted into `$GITHUB_ENV` so every step below reads `$APPLE_ID` the
      # way it always did. Each value is masked first: `$GITHUB_ENV` does *not*
      # mask on its own, and an unmasked notarization password is one `set -x`
      # away from the log.
      - name: Load macOS release credentials
        if: runner.os == 'macOS'
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
        run: |
          set -euo pipefail

          # Missing signing material stops the *signing*, not the release.
          #
          # This used to `exit 1`, which took the whole darwin leg down with it —
          # including the publish step at the end of this job. The result was
          # releases carrying linux and windows binaries and no macOS ones at
          # all, from v0.0.37 to v0.0.78, and Pantry (which only surfaces a
          # version whose release has the full prebuilt set) pinned at 0.0.37
          # for a year. Nobody noticed, because the tag, the changelog and the
          # GitHub release all still appeared.
          #
          # A macOS binary Pantry can install unsigned beats no macOS binary at
          # all: it is fetched programmatically, so it carries no quarantine
          # attribute and Gatekeeper does not gate it. When the secret is
          # present this behaves exactly as before.
          if [ -z "${DOTENV_PRIVATE_KEY_PRODUCTION:-}" ]; then
            echo "::warning::DOTENV_PRIVATE_KEY_PRODUCTION is not set — publishing macOS binaries unsigned."
            echo "::warning::Set it to restore signing and notarization: gh secret set DOTENV_PRIVATE_KEY_PRODUCTION"
            echo "SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
            exit 0
          fi

          missing=""
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY KEYCHAIN_PASSWORD APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
            value="$(bunx --bun buddy env:get "$name" --file .env.production 2>/dev/null || true)"

            if [ -z "$value" ]; then
              missing="$missing $name"
              continue
            fi

            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done

          if [ -n "$missing" ]; then
            echo "::warning::Empty in .env.production:$missing — publishing macOS binaries unsigned."
            echo "SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"

      - name: Import signing certificate
        if: runner.os == 'macOS' && env.SIGNING_AVAILABLE == 'true'
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Sign macOS binary
        if: runner.os == 'macOS' && env.SIGNING_AVAILABLE == 'true'
        run: |
          set -euo pipefail
          ENTITLEMENTS="scripts/entitlements-distribution.plist"
          if [ ! -f "$ENTITLEMENTS" ]; then
            echo "::error file=$ENTITLEMENTS::missing — required for hardened-runtime signing"
            exit 1
          fi
          echo "Using entitlements: $ENTITLEMENTS"
          for binary in \
            packages/zig/zig-out/bin/craft \
            packages/zig/zig-out/cross/darwin-x64/craft; do
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" \
              --entitlements "$ENTITLEMENTS" "$binary"
            codesign --verify --deep --strict "$binary"
          done
          echo "macOS ARM64 and x64 binaries signed successfully"

      - name: Verify standalone macOS launch and signatures
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun test ./scripts/macos-release.test.ts
          bun scripts/verify-macos-release.ts packages/zig/zig-out/bin/craft "$VERSION"
          bun scripts/verify-macos-release.ts packages/zig/zig-out/cross/darwin-x64/craft "$VERSION" --no-execute

      - name: Notarize macOS binaries
        if: runner.os == 'macOS' && env.SIGNING_AVAILABLE == 'true'
        run: |
          set -euo pipefail
          for tuple in \
            "packages/zig/zig-out/bin/craft:arm64" \
            "packages/zig/zig-out/cross/darwin-x64/craft:x64"; do
            IFS=: read -r binary architecture <<< "$tuple"
            archive="craft-${architecture}.zip"
            ditto -c -k --keepParent "$binary" "$archive"
            # A raw Mach-O binary has no stapler-supported container. Submit
            # an archive containing the exact signed binary and require
            # Apple's final Accepted result; Gatekeeper retrieves that ticket
            # online for the binary distributed by the release.
            xcrun notarytool submit "$archive" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait \
              --timeout 30m
            codesign --verify --deep --strict "$binary"
            rm "$archive"
          done

      - uses: ./.github/actions/setup-release-scanners

      - name: Scan binaries prepared for publication
        env:
          CRAFT_PLATFORM: ${{ runner.os == 'macOS' && 'macos' || 'linux' }}
        run: bun scripts/scan-release-artifacts.ts "$CRAFT_PLATFORM" packages/zig/zig-out "$RUNNER_TEMP/native-release-scan"

      # ── Stage the release privately ────────────────────
      # The action packages binaries from zig-out/ into platform-named zips
      # and adds this leg's scanned archives to a draft GitHub release. Do not
      # publish the Zig package here: a failed second leg would otherwise make
      # an incomplete version visible in the pantry registry.
      - name: Stage draft release
        uses: pantry-pm/pantry/packages/action@e0e7377f6f94f1348b8efcfd3e631967261c6dce # v0.11.66
        with:
          version: '0.11.64'
          install: 'false'
          release: 'true'
          release-draft: 'true'
          release-changelog: CHANGELOG.md
          release-token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

  # ── Gate: is this release actually installable? ─────────────────────
  #
  # v0.0.82 published with no macOS binaries at all. The darwin leg failed at
  # notarization while the linux leg had already made a partial GitHub release
  # public. The matrix now stages a draft instead; this gate still names any
  # missing platform archive and builds the manifest over the final bytes.
  #
  # `fail-fast: false` on the matrix is deliberate and stays — one platform's
  # signing trouble should not throw away another's build. A failed leg keeps
  # the release private; this job goes red, naming the assets that are missing.
  verify-release:
    name: verify release assets
    needs: [validate-release, pantry]
    if: ${{ !cancelled() && needs.validate-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Every platform pantry installs must have shipped
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" != true ]; then
            echo "::error::$TAG must remain a draft until every release gate passes."
            exit 1
          fi

          # Kept in step with the `required` list in pantry's recipe:
          # packages/ts-pantry/src/recipes/craft-native.org.ts
          REQUIRED="craft-darwin-arm64.zip craft-darwin-x64.zip craft-linux-x64.zip craft-windows-x64.zip"

          echo "Assets on $TAG:"
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          echo "$ASSETS" | sed 's/^/  /'

          MISSING=""
          for asset in $REQUIRED; do
            echo "$ASSETS" | grep -qx "$asset" || MISSING="$MISSING $asset"
          done

          if [ -n "$MISSING" ]; then
            echo "::error::$TAG is missing:$MISSING — pantry will never list this version."
            echo "::error::Re-run the failed platform leg, then re-run this job. Publishing a release without the full prebuilt set leaves a version that looks released and cannot be installed."
            exit 1
          fi

          echo "All required assets present."

      - name: Publish and verify the complete release manifest
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ARCHIVE_DIR=$(mktemp -d)
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'craft-*.zip' --dir "$ARCHIVE_DIR"
          bun scripts/release-manifest.ts create "$ARCHIVE_DIR" "$ARCHIVE_DIR/release-manifest.json"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$ARCHIVE_DIR/release-manifest.json" --clobber
          mkdir "$ARCHIVE_DIR/verified"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json --dir "$ARCHIVE_DIR/verified"
          bun scripts/release-manifest.ts verify "$ARCHIVE_DIR" "$ARCHIVE_DIR/verified/release-manifest.json"

  publish-pantry:
    name: publish verified Zig package to pantry
    needs: [validate-release, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      # Zig publication reads build.zig.zon and packages its declared source
      # paths; it does not rebuild a platform binary. The complete GitHub
      # release is public before this registry version can become visible.
      - name: Publish Zig package
        uses: pantry-pm/pantry/packages/action@e0e7377f6f94f1348b8efcfd3e631967261c6dce # v0.11.66
        with:
          version: '0.11.64'
          install: 'false'
          publish: 'zig'
          package-dir: packages/zig
          token: ${{ secrets.PANTRY_TOKEN }}

  notify-registry:
    name: notify registry and channel after publication
    needs: [publish-release, publish-pantry]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Tell the registry this version exists, with the token this workflow
      # already holds to publish to it.
      #
      # This used to POST a `repository_dispatch` to pantry-pm/pantry, which
      # needed a GitHub PAT with write access to a repository this one does not
      # own — a second credential, per publishing project, for the sole purpose
      # of poking a workflow. The secret was never created, so the step warned
      # and did nothing on every release, and the registry only ever learned
      # about a new version when its cron next swept all several hundred
      # packages. PANTRY_TOKEN authenticates to the registry itself, which is
      # the thing that actually needs to know, so ask it directly.
      #
      # Best-effort: the sweep remains the backstop, so an unreachable registry
      # warns rather than failing a release that is otherwise complete.
      - name: Tell the pantry registry to index this version
        if: ${{ success() }}
        env:
          PANTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
        run: |
          if [ -z "${PANTRY_TOKEN:-}" ]; then
            echo "::warning::No PANTRY_TOKEN — the registry will pick this up on its next scheduled sweep instead."
            exit 0
          fi

          if ! code=$(curl -sS -o /tmp/index.out -w '%{http_code}' --max-time 30 \
            -X POST https://registry.pantry.dev/api/rebuild \
            -H "Authorization: Bearer $PANTRY_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"domain":"craft-native.org"}'); then
            echo "::warning::Registry request failed — it will index this on its next sweep."
            exit 0
          fi

          if [ "$code" = "200" ]; then
            echo "Registry notified: craft-native.org queued for indexing."
          else
            # Not fatal: the release is good, and the sweep will still find it.
            echo "::warning::Registry returned $code — it will index this on its next sweep."
            cat /tmp/index.out || true
          fi

      - name: Announce only the complete public release
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::warning::No Discord webhook — skipping the release announcement."
            exit 0
          fi

          release_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          payload=$(jq -nc --arg tag "$TAG" --arg url "$release_url" \
            '{embeds:[{title:("craft " + $tag + " — Published"),url:$url,description:"All platform archives and release SBOMs verified."}]}')
          if ! code=$(curl -sS -o /tmp/discord.out -w '%{http_code}' --max-time 30 \
            -H 'Content-Type: application/json' -d "$payload" "$DISCORD_WEBHOOK_URL"); then
            echo "::warning::Discord notification failed after publication."
            exit 0
          fi
          if [ "$code" = 204 ] || [ "$code" = 200 ]; then
            echo "Complete release announced to Discord."
          else
            echo "::warning::Discord returned $code after publication."
          fi

  verify-macos-downloads:
    name: verify downloaded ${{ matrix.platform.name }}
    needs: [validate-release, pantry]
    if: ${{ !cancelled() && needs.validate-release.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: macos-15, name: darwin-arm64 }
          - { os: macos-15-intel, name: darwin-x64 }
    runs-on: ${{ matrix.platform.os }}
    # write, though this job only downloads: the release is still a draft
    # here, and GitHub hides drafts from read-only tokens, so `gh release
    # download` answered "release not found" (v0.0.106).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@e0e7377f6f94f1348b8efcfd3e631967261c6dce # v0.11.66
        with:
          version: '0.11.64'
      - name: Verify the final downloadable executable
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform.name }}
        run: |
          set -euo pipefail
          DOWNLOAD_DIR=$(mktemp -d)
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "craft-$PLATFORM.zip" --dir "$DOWNLOAD_DIR"
          ditto -x -k "$DOWNLOAD_DIR/craft-$PLATFORM.zip" "$DOWNLOAD_DIR/extracted"
          bun scripts/verify-macos-release.ts "$DOWNLOAD_DIR/extracted/craft" "${TAG#v}"

  verify-desktop-downloads:
    name: verify downloaded ${{ matrix.platform.name }}
    needs: [validate-release, pantry]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: windows-2025, name: windows-x64 }
    runs-on: ${{ matrix.platform.os }}
    # write, though this job only downloads: the release is still a draft
    # here, and GitHub hides drafts from read-only tokens, so `gh release
    # download` answered "release not found" (v0.0.106).
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      PLATFORM: ${{ matrix.platform.name }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Verify downloaded Linux CLI
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          DOWNLOAD_DIR=$(mktemp -d)
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "craft-$PLATFORM.zip" --dir "$DOWNLOAD_DIR"
          mkdir "$DOWNLOAD_DIR/extracted"
          unzip -q "$DOWNLOAD_DIR/craft-$PLATFORM.zip" -d "$DOWNLOAD_DIR/extracted"
          bun scripts/verify-native-startup.ts "$DOWNLOAD_DIR/extracted/craft" "${TAG#v}"
      - name: Verify downloaded Windows CLI and loader
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP "craft-$env:PLATFORM.zip"
          $extracted = Join-Path $env:RUNNER_TEMP "craft-$env:PLATFORM"
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "craft-$env:PLATFORM.zip" --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Windows release archive download failed' }
          Expand-Archive -LiteralPath $archive -DestinationPath $extracted
          $binary = Join-Path $extracted 'craft.exe'
          if (-not (Test-Path -LiteralPath (Join-Path $extracted 'WebView2Loader.dll'))) { throw 'Windows release archive has no WebView2 loader' }
          $version = $env:TAG -replace '^v', ''
          bun scripts/verify-native-startup.ts $binary $version
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded Windows CLI failed to start' }

  attach-release-sbom:
    name: attach and verify release SBOMs
    needs: [pantry, release-sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom
          path: sbom
      - name: Attach the SBOMs produced by this release run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bun scripts/verify-sbom.ts sbom "$TAG"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            sbom/craft-sbom.json sbom/full-sbom.cyclonedx.json sbom/full-sbom.spdx.json --clobber
          VERIFY_DIR=$(mktemp -d)
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'craft-sbom.json' \
            --pattern 'full-sbom.cyclonedx.json' --pattern 'full-sbom.spdx.json' --dir "$VERIFY_DIR"
          bun scripts/verify-sbom.ts "$VERIFY_DIR" "$TAG"
          for document in craft-sbom.json full-sbom.cyclonedx.json full-sbom.spdx.json; do
            cmp "sbom/$document" "$VERIFY_DIR/$document"
          done

  prepare-npm:
    name: verify and stage npm packages
    needs: [validate-release, release-sbom]
    if: ${{ !cancelled() && needs.validate-release.result == 'success' && needs.release-sbom.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pantry (provides Bun, Zig, etc.)
        uses: pantry-pm/pantry/packages/action@e0e7377f6f94f1348b8efcfd3e631967261c6dce # v0.11.66
        with:
          version: '0.11.64'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - uses: ./.github/actions/setup-release-scanners

      - name: Test package regressions
        run: bun run test:packages

      - name: Build and verify every npm artifact
        run: bun scripts/npm-packages.ts --archive-dir "$RUNNER_TEMP/craft-npm-archives"

      - name: Scan packed npm artifacts and production dependencies
        run: bun scripts/scan-release-artifacts.ts npm "$RUNNER_TEMP/craft-npm-archives" "$RUNNER_TEMP/npm-release-scan"

      - name: Stage verified npm archives privately
        uses: actions/upload-artifact@v4
        with:
          name: npm-archives
          path: ${{ runner.temp }}/craft-npm-archives/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish-release:
    name: publish complete verified release
    needs: [validate-release, verify-release, verify-macos-downloads, verify-desktop-downloads, attach-release-sbom, prepare-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Recheck the draft and its exact staged artifacts
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" != true ]; then
            echo "::error::$TAG is not a draft; refusing to publish or modify an already public release."
            exit 1
          fi

          STAGED=$(mktemp -d)
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'craft-*.zip' \
            --pattern 'release-manifest.json' --pattern '*sbom*.json' --dir "$STAGED"
          bun scripts/release-manifest.ts verify "$STAGED" "$STAGED/release-manifest.json"
          bun scripts/verify-sbom.ts "$STAGED" "$TAG"

      - name: Publish the complete draft
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            # Let GitHub's semantic-version ordering decide whether this tag
            # becomes Latest; rerunning an older tag must not move it backward.
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" = false

  npm:
    name: npm
    # A failed package test, build, or scan leaves the native release private.
    # Publish only the exact archives prepared above, after the complete
    # native release becomes public. The manifest checks every archive hash
    # again after artifact download and before each npm publish.
    needs: [validate-release, release-sbom, prepare-npm, publish-release]
    if: ${{ !cancelled() && needs.validate-release.result == 'success' && needs.release-sbom.result == 'success' && needs.prepare-npm.result == 'success' && needs.publish-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pantry (provides Bun, Zig, etc.)
        uses: pantry-pm/pantry/packages/action@e0e7377f6f94f1348b8efcfd3e631967261c6dce # v0.11.66
        with:
          version: '0.11.64'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm CLI with trusted publishing support
        run: npm install --global npm@11.15.0

      - name: Download verified npm archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-archives
          path: ${{ runner.temp }}/craft-npm-archives

      - name: Publish scanned npm archives
        run: bun scripts/publish-npm-archives.ts "$RUNNER_TEMP/craft-npm-archives"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
