name: Native Media Cache

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [all, ios, android, sdk]
        default: all
  workflow_call:
    inputs:
      platform:
        type: string
        default: all

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  sdk:
    if: inputs.platform == 'all' || inputs.platform == 'sdk' || inputs.platform == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun run test:sdk
      - run: bun run typecheck
      - run: bun run build:npm
      - run: bun run verify:packages
      - run: bunx --bun pickier .

  ios:
    if: inputs.platform == 'all' || inputs.platform == 'ios' || inputs.platform == ''
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      CRAFT_PROBE_PACKAGED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun run test:sdk
      - run: bun run build:sdk
      - name: Native disk-full, cleanup, retry, interruptions and video decode
        run: |
          mkdir -p artifacts/media-cache
          bun scripts/media-cache.ts ios 2>&1 | tee artifacts/media-cache/ios.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-media-cache
          path: artifacts/media-cache
          if-no-files-found: error

  android:
    if: inputs.platform == 'all' || inputs.platform == 'android' || inputs.platform == ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CRAFT_PROBE_PACKAGED: '1'
      GRADLE_EXECUTABLE: gradle
      PROBE_GRADLE_ONLINE: '1'
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - run: bun install --frozen-lockfile
      - run: bun run build:sdk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: |
            mkdir -p artifacts/media-cache
            bash -o pipefail -c 'bun scripts/media-cache.ts android 2>&1 | tee artifacts/media-cache/android.log'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-media-cache
          path: artifacts/media-cache
          if-no-files-found: error
