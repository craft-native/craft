<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Craft mobile E2E</title>
  <style>
    body { font: 14px -apple-system, Roboto, sans-serif; background: #0b1712; color: #e6f2ec; padding: 16px; }
    li { margin: 4px 0; font-family: ui-monospace, monospace; }
    .pass { color: #7ee08a; }
    .fail { color: #ff8a80; }
  </style>
</head>
<body>
  <h1 id="headline">Craft mobile E2E</h1>
  <ul id="results"></ul>
  <p id="deeplink"></p>
  <script>
  // The page drives itself and reports through the bridge's own `log` action,
  // which is the one channel both runtimes already forward off-device: iOS
  // prints "[Craft Web] <message>" to the process stderr that
  // `simctl launch --console-pty` captures, and Android writes it to logcat
  // under the CraftBridge tag. Nothing else in the generated app reaches a
  // host-side reader, so the harness would otherwise be watching a screenshot.
  //
  // Every line is CRAFT-E2E followed by one JSON object. The harness reads
  // three kinds: `plan` (once, up front), `case` (once per case), and `done`.
  // Announcing the plan before running anything is what lets the harness tell
  // "this case failed" apart from "this case never ran" — a suite that dies
  // halfway through is a failure, not a pass with fewer cases.
  (function () {
    // Every deep link the native side dispatches, recorded from the first line
    // of the page, before the bridge exists. This is how the page knows it was
    // opened by a link without asking getInitialURL, which would claim the
    // launch link and change what onLink receives.
    var dispatchedLinks = []
    window.addEventListener('craftDeepLink', function (event) { dispatchedLinks.push(event.detail || {}) })

    var NONCE = '__CRAFT_E2E_NONCE__'
    // Which platform the harness built this leg for. Substituted in from
    // outside, because the page comparing window.craft.platform against a
    // value it read out of window.craft.platform is a tautology - it was one,
    // and bridge.ready passed unconditionally until this arrived.
    var EXPECTED_PLATFORM = '__CRAFT_E2E_PLATFORM__'
    var CASE_TIMEOUT_MS = 8000

    function emit(payload) {
      var line = 'CRAFT-E2E ' + JSON.stringify(payload)
      // console.log first: on Android it reaches logcat under `chromium` even
      // when the bridge never arrived, which is the case the harness most
      // needs evidence for.
      try { console.log(line) } catch (ignored) {}
      try { if (window.craft && window.craft.log) window.craft.log(line) } catch (ignored) {}
    }

    function show(name, ok, detail) {
      var li = document.createElement('li')
      li.className = ok ? 'pass' : 'fail'
      li.textContent = (ok ? 'PASS ' : 'FAIL ') + name + (detail ? ' — ' + detail : '')
      document.getElementById('results').appendChild(li)
    }

    // Rejections arrive in three shapes across the two runtimes: an Error from
    // iOS's _rejectCallback, a bare string from Android's named reject globals
    // (promise-runtime.ts parks `window._craftPushReject` and Kotlin calls it
    // with a quoted string), and an object with `code`/`message` from iOS's
    // capability gate. Normalise once here so a case can assert on a code
    // without caring which runtime produced it.
    function describeError(error) {
      if (error === null || error === undefined) return { code: '', message: '' }
      if (typeof error === 'string') return { code: '', message: error }
      return { code: String(error.code || ''), message: String(error.message || error) }
    }

    function withTimeout(run, timeoutMs) {
      return new Promise(function (resolve) {
        var settled = false
        var timer = setTimeout(function () {
          if (settled) return
          settled = true
          resolve({ state: 'timeout' })
        }, timeoutMs || CASE_TIMEOUT_MS)

        function finish(value) {
          if (settled) return
          settled = true
          clearTimeout(timer)
          resolve(value)
        }

        try {
          Promise.resolve(run()).then(
            function (value) { finish({ state: 'resolved', value: value }) },
            function (error) { finish({ state: 'rejected', error: describeError(error) }) }
          )
        }
        catch (thrown) {
          finish({ state: 'rejected', error: describeError(thrown) })
        }
      })
    }

    // A case passes only by returning nothing. Returning a string is how it
    // explains what it saw instead, and that string lands in the report — so a
    // failure names the actual value rather than just the assertion that broke.
    var CASES = [
      {
        name: 'bridge.ready',
        platforms: ['ios', 'android'],
        run: function () {
          if (!window.craft) return 'window.craft is absent'
          if (typeof window.craft.log !== 'function') return 'window.craft has no log function'
          if (window.craft.platform !== EXPECTED_PLATFORM)
            return 'platform is ' + window.craft.platform + ', expected ' + EXPECTED_PLATFORM
        }
      },
      {
        // Ground truth the page cannot invent: `isSimulator` comes from Swift's
        // `#if targetEnvironment(simulator)`, decided by the compiler, and
        // `isEmulator` from the device's own Build properties. A stubbed bridge
        // that echoed plausible JSON would have to guess it right.
        name: 'deviceInfo.isSimulator',
        platforms: ['ios'],
        run: function () {
          return withTimeout(function () { return window.craft.getDeviceInfo() }).then(function (outcome) {
            if (outcome.state !== 'resolved') return 'getDeviceInfo ' + outcome.state
            if (!outcome.value) return 'getDeviceInfo resolved with nothing'
            if (outcome.value.platform !== 'ios') return 'platform is ' + outcome.value.platform
            if (outcome.value.isSimulator !== true) return 'isSimulator is ' + outcome.value.isSimulator
          })
        }
      },
      {
        name: 'deviceInfo.isEmulator',
        platforms: ['android'],
        run: function () {
          return withTimeout(function () { return window.craft.getDeviceInfo() }).then(function (outcome) {
            if (outcome.state !== 'resolved') return 'getDeviceInfo ' + outcome.state
            if (!outcome.value) return 'getDeviceInfo resolved with nothing'

            // Reported before anything is asserted, so a failing assertion
            // still leaves the values behind. The first run of this case said
            // only "isEmulator is false" and the log did not say what the
            // device had called itself, which is the one thing needed to fix
            // it.
            emit({ event: 'observed', name: 'sdkVersion', value: outcome.value.sdkVersion })
            emit({ event: 'observed', name: 'model', value: outcome.value.model })
            emit({ event: 'observed', name: 'manufacturer', value: outcome.value.manufacturer })
            emit({ event: 'observed', name: 'device', value: outcome.value.device })

            if (outcome.value.platform !== 'android') return 'platform is ' + outcome.value.platform
            if (!outcome.value.sdkVersion) return 'sdkVersion is ' + outcome.value.sdkVersion
            if (outcome.value.isEmulator !== true)
              return 'isEmulator is ' + outcome.value.isEmulator + ' on model ' + outcome.value.model
          })
        }
      },
      {
        // The success path. On iOS the harness then reads the device pasteboard
        // from the host with `simctl pbpaste`, so the case asserts the value
        // reached real system clipboard state rather than a variable the bridge
        // handed back. Android has no equally cheap host-side read, so its
        // external check is the sdkVersion cross-reference below instead.
        name: 'clipboard.roundTrip',
        platforms: ['ios', 'android'],
        run: function () {
          return withTimeout(function () { return window.craft.clipboard.write(NONCE) }).then(function (written) {
            if (written.state !== 'resolved') return 'clipboard.write ' + written.state + ' ' + (written.error ? written.error.message : '')
            return withTimeout(function () { return window.craft.clipboard.read() }).then(function (read) {
              if (read.state !== 'resolved') return 'clipboard.read ' + read.state + ' ' + (read.error ? read.error.message : '')
              if (read.value !== NONCE) return 'read back ' + JSON.stringify(read.value)
            })
          })
        }
      },
      {
        // The second half of #197: asking for location permission the app
        // already holds used to wait for an authorization change that never
        // comes, because nothing changes. The harness grants it with
        // `simctl privacy` before launch, so both calls must answer at once.
        //
        // And #192 on Android, where a device with location granted reported
        // something other than `granted`. The harness grants approximate
        // location only, with `pm grant`, which is the case a bridge
        // requiring precise location gets wrong.
        name: 'permissions.location.granted',
        platforms: ['ios', 'android'],
        run: function () {
          return withTimeout(function () { return window.craft.permissions.check('location') }).then(function (checked) {
            if (checked.state !== 'resolved') return 'permissions.check ' + checked.state + ' ' + (checked.error ? checked.error.message : '')
            if (checked.value !== 'granted') return 'permissions.check answered ' + JSON.stringify(checked.value)
            return withTimeout(function () { return window.craft.permissions.request('location') }).then(function (requested) {
              if (requested.state === 'timeout') return 'permissions.request never settled for a permission already granted'
              if (requested.state !== 'resolved') return 'permissions.request rejected: ' + requested.error.message
              if (requested.value !== 'granted') return 'permissions.request answered ' + JSON.stringify(requested.value)
            })
          })
        }
      },
      {
        // #197 as reported: high accuracy, no cached fix, a fifteen-second
        // timeout, on a simulator with an explicit coordinate. It never
        // settled. The harness sets the coordinate with `simctl location`
        // and compares it with what the page reports, so a position the
        // bridge invented would not match.
        name: 'geolocation.currentPosition',
        platforms: ['ios'],
        run: function () {
          var options = { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
          return withTimeout(function () { return window.craft.location.getCurrentPosition(options) }, 20000).then(function (outcome) {
            if (outcome.state === 'timeout') return 'getCurrentPosition never settled, not even by its own 15s timeout'
            if (outcome.state === 'rejected')
              return 'getCurrentPosition rejected: ' + outcome.error.code + ' ' + outcome.error.message
            if (!outcome.value) return 'getCurrentPosition resolved with nothing'
            emit({ event: 'observed', name: 'latitude', value: outcome.value.latitude })
            emit({ event: 'observed', name: 'longitude', value: outcome.value.longitude })
            if (typeof outcome.value.latitude !== 'number' || typeof outcome.value.longitude !== 'number')
              return 'position is ' + JSON.stringify(outcome.value)
          })
        }
      },
      {
        // #207. `craft.geolocation.watchPosition` posted no callbackId, so a
        // page could not tell a watch that started from one refused. It
        // answers once updates have started; fixes still arrive as events.
        // After currentPosition, so authorization is already settled.
        name: 'geolocation.watchPosition.resolvesTrue',
        platforms: ['ios'],
        run: function () {
          return withTimeout(function () { return window.craft.geolocation.watchPosition(function () {}) }).then(function (outcome) {
            if (outcome.state === 'timeout') return 'watchPosition never settled'
            if (outcome.state === 'rejected') return 'watchPosition rejected: ' + outcome.error.code + ' ' + outcome.error.message
            if (outcome.value !== true) return 'watchPosition resolved with ' + JSON.stringify(outcome.value)
          })
        }
      },
      {
        name: 'geolocation.clearWatch.resolvesTrue',
        platforms: ['ios'],
        run: function () {
          return withTimeout(function () { return window.craft.geolocation.clearWatch() }).then(function (outcome) {
            if (outcome.state === 'timeout') return 'clearWatch never settled'
            if (outcome.state === 'rejected') return 'clearWatch rejected: ' + outcome.error.code + ' ' + outcome.error.message
            if (outcome.value !== true) return 'clearWatch resolved with ' + JSON.stringify(outcome.value)
          })
        }
      },
      {
        // #207 again, and the half a callbackId alone would have broken.
        // Haptics is on, and native used to answer an enabled haptic with
        // nothing at all; it only ever rejected. So a page that awaited it
        // would wait for ever on every call that worked.
        //
        // Android answered nothing at all until #219, on every path.
        name: 'haptic.resolvesTrue',
        platforms: ['ios', 'android'],
        run: function () {
          return withTimeout(function () { return window.craft.haptic('light') }).then(function (outcome) {
            if (outcome.state === 'timeout') return 'haptic never settled with haptics enabled'
            if (outcome.state === 'rejected') return 'haptic rejected: ' + outcome.error.code + ' ' + outcome.error.message
            if (outcome.value !== true) return 'haptic resolved with ' + JSON.stringify(outcome.value)
          })
        }
      },
      {
        name: 'vibrate.resolvesTrue',
        platforms: ['ios', 'android'],
        run: function () {
          // Android hands the pattern to VibrationEffect.createWaveform,
          // which rejects an empty one, so the two platforms send what each
          // actually accepts rather than agreeing on a value neither uses.
          var pattern = EXPECTED_PLATFORM === 'android' ? [100, 50, 100] : []
          return withTimeout(function () { return window.craft.vibrate(pattern) }).then(function (outcome) {
            if (outcome.state === 'timeout') return 'vibrate never settled'
            if (outcome.state === 'rejected') return 'vibrate rejected: ' + outcome.error.code + ' ' + outcome.error.message
            if (outcome.value !== true) return 'vibrate resolved with ' + JSON.stringify(outcome.value)
          })
        }
      },
      {
        // Speech recognition is off, and `startListening` used to drop the
        // refusal: the page got undefined and no craftSpeechError either.
        // Refused before any authorization prompt, so nothing waits on a
        // microphone the simulator does not have.
        //
        // Android refuses from the same gate since #209, but could not carry
        // the refusal until #219 gave the call a promise to reject.
        name: 'speech.disabled.rejects',
        platforms: ['ios', 'android'],
        run: function () {
          return withTimeout(function () { return window.craft.startListening() }).then(function (outcome) {
            if (outcome.state === 'timeout') return 'startListening never settled'
            if (outcome.state === 'resolved') return 'startListening resolved with ' + JSON.stringify(outcome.value) + ' while speech recognition is disabled'
            if (outcome.error.code !== 'CAPABILITY_DISABLED') return 'code is ' + JSON.stringify(outcome.error.code)
          })
        }
      },
      {
        // stopListening is not gated on either platform, so it runs with
        // speech off, and it is the one speech call whose success path a
        // simulator or emulator can reach without a microphone. It used to
        // answer nothing on either side.
        name: 'speech.stopListening.resolvesTrue',
        platforms: ['ios', 'android'],
        run: function () {
          return withTimeout(function () { return window.craft.stopListening() }).then(function (outcome) {
            if (outcome.state === 'timeout') return 'stopListening never settled'
            if (outcome.state === 'rejected') return 'stopListening rejected: ' + outcome.error.code + ' ' + outcome.error.message
            if (outcome.value !== true) return 'stopListening resolved with ' + JSON.stringify(outcome.value)
          })
        }
      },
      {
        // Sharing is off too, and this is the call that used to answer
        // nothing: `craft.share(text)` posted no callbackId, so Swift's
        // CAPABILITY_DISABLED stopped at a nil guard and the page got
        // `undefined`, which a caller awaiting it reads as success (#203).
        // The refusal settles long before any sheet could appear, so the case
        // needs nobody at the simulator.
        name: 'share.disabled.rejects',
        platforms: ['ios'],
        run: function () {
          return withTimeout(function () { return window.craft.share('craft e2e ' + NONCE) }).then(function (outcome) {
            if (outcome.state === 'timeout') return 'share never settled'
            if (outcome.state === 'resolved') return 'share resolved with ' + JSON.stringify(outcome.value) + ' while sharing is disabled'
            if (outcome.error.code !== 'CAPABILITY_DISABLED') return 'code is ' + JSON.stringify(outcome.error.code)
          })
        }
      },
      {
        // Android does not gate sharing on a flag, so its refusal is the one
        // both platforms share: an empty string is nothing to share. It is
        // refused before any menu opens, and used to be refused by nobody -
        // the call returned undefined whatever happened (#203).
        name: 'share.empty.rejects',
        platforms: ['android'],
        run: function () {
          return withTimeout(function () { return window.craft.share('') }).then(function (outcome) {
            if (outcome.state === 'timeout') return 'share never settled'
            if (outcome.state === 'resolved') return 'share resolved with ' + JSON.stringify(outcome.value) + ' for an empty string'
            if (outcome.error.message.indexOf('Nothing to share') === -1)
              return 'message is ' + JSON.stringify(outcome.error.message)
          })
        }
      },
      {
        // The cancellation path, and the one case that needs a person. The
        // page announces that it is about to open the share menu, the harness
        // waits until the menu is really in front, screenshots it and presses
        // Back, and the promise has to resolve false. False, not a rejection:
        // dismissing the menu is a choice the person made, not an error.
        //
        // A share that resolved false on its own would pass this without a
        // menu ever appearing, which is why the harness also fails the run
        // when it was asked to dismiss a menu and never saw one.
        name: 'share.dismissed.resolvesFalse',
        platforms: ['android'],
        run: function () {
          emit({ event: 'awaiting', name: 'share.dismissed.resolvesFalse', need: 'dismiss-share-menu' })
          return withTimeout(function () { return window.craft.share('craft e2e ' + NONCE, 'Craft E2E') }, 60000).then(function (outcome) {
            if (outcome.state === 'timeout') return 'share never settled after the menu was dismissed'
            if (outcome.state === 'rejected') return 'share rejected: ' + outcome.error.message
            if (outcome.value !== false) return 'share resolved with ' + JSON.stringify(outcome.value) + ', expected false for a dismissed menu'
          })
        }
      },
      {
        // Android's equivalent gate, and since #209 the same code iOS sends:
        // push is off in this app's config, so the call is refused rather
        // than reaching Firebase. capabilities says so too, and the case
        // checks that the two agree.
        name: 'push.disabled.rejects',
        platforms: ['android'],
        run: function () {
          if (window.craft.capabilities.pushNotifications !== false)
            return 'capabilities.pushNotifications is ' + JSON.stringify(window.craft.capabilities.pushNotifications)
          return withTimeout(function () { return window.craft.registerPush() }).then(function (outcome) {
            if (outcome.state === 'timeout') return 'registerPush never settled'
            if (outcome.state === 'resolved') return 'registerPush resolved while push is disabled'
            if (outcome.error.code !== 'CAPABILITY_DISABLED') return 'code is ' + JSON.stringify(outcome.error.code)
          })
        }
      },
      {
        // #209: a capability the app was built with is served, and the page
        // can tell which is which from capabilities alone. Sharing is on in
        // this app precisely so the refusal above is not the only answer the
        // gate can give.
        name: 'capabilities.match.behaviour',
        platforms: ['android'],
        run: function () {
          if (window.craft.capabilities.share !== true)
            return 'capabilities.share is ' + JSON.stringify(window.craft.capabilities.share)
          if (window.craft.capabilities.secureStorage !== false)
            return 'capabilities.secureStorage is ' + JSON.stringify(window.craft.capabilities.secureStorage)
          return withTimeout(function () { return window.craft.secureStore.set('craft-e2e', NONCE) }).then(function (outcome) {
            if (outcome.state === 'timeout') return 'secureStore.set never settled'
            if (outcome.state === 'resolved') return 'secureStore.set resolved while secure storage is disabled'
            if (outcome.error.code !== 'CAPABILITY_DISABLED') return 'code is ' + JSON.stringify(outcome.error.code)
          })
        }
      }
    ]

    // #198: a cold-start link reaches a page that subscribes late.
    //
    // Runs after the suite, so the subscription is seconds after the bridge
    // appeared, the way an app that hydrates before wiring its router
    // subscribes. On iOS the harness cold-starts the app through a link from
    // an XCUITest, which reads this paragraph back: the app's console is not
    // captured on that launch, because SpringBoard started it, not simctl. On
    // Android (#215) `am start` opens the link and the harness reads the same
    // line from logcat.
    //
    // The link says which way to receive it. `receive=subscribe` only
    // subscribes, and must get the launch link exactly once. `receive=both`
    // calls getInitialURL and subscribes in the same tick, and must get it
    // from getInitialURL alone, not twice. On an ordinary launch there is no
    // link, and the paragraph says so.
    function probeDeepLinks() {
      var launch = dispatchedLinks.filter(function (detail) { return detail.initial === true })[0] || null
      var receive = launch && launch.url.indexOf('receive=both') !== -1 ? 'both' : 'subscribe'
      var seen = { launch: launch ? launch.url : null, receive: receive, onLink: [], initialURL: null, unsubscribe: null }
      var answered = receive !== 'both'
      if (receive === 'both') {
        window.craft.deepLinks.getInitialURL().then(
          function (value) { seen.initialURL = value && value.url; answered = true },
          function () { answered = true }
        )
      }
      var unsubscribe = window.craft.deepLinks.onLink(function (detail) {
        seen.onLink.push({ url: detail && detail.url, initial: detail && detail.initial })
      })
      seen.unsubscribe = typeof unsubscribe
      // Long enough for a replay, or a second delivery, to have arrived, and
      // for getInitialURL to answer on a slow emulator.
      var waited = 0
      function report() {
        waited += 250
        if ((!answered || waited < 1500) && waited < 6000) { setTimeout(report, 250); return }
        var line = 'CRAFT-E2E-DEEPLINK ' + JSON.stringify(seen)
        document.getElementById('deeplink').textContent = line
        try { console.log(line) } catch (ignored) {}
        try { if (window.craft && window.craft.log) window.craft.log(line) } catch (ignored) {}
      }
      setTimeout(report, 250)
    }

    function waitForBridge(attempt) {
      if (window.craft && window.craft.getDeviceInfo) return Promise.resolve(true)
      if (attempt >= 150) return Promise.resolve(false)
      return new Promise(function (resolve) {
        setTimeout(function () { resolve(waitForBridge(attempt + 1)) }, 100)
      })
    }

    waitForBridge(0).then(function (ready) {
      if (!ready) {
        emit({ event: 'fatal', reason: 'window.craft never appeared' })
        document.getElementById('headline').textContent = 'FATAL: no bridge'
        return
      }

      var platform = window.craft.platform
      var selected = CASES.filter(function (entry) { return entry.platforms.indexOf(platform) !== -1 })
      emit({ event: 'plan', platform: platform, run: NONCE, cases: selected.map(function (entry) { return entry.name }) })

      var passed = 0
      var failed = 0

      // Sequential, not Promise.all. Android's promise runtime is single-flight
      // per channel and rejects a second in-flight request outright; running
      // the suite in parallel would fail cases for colliding with each other.
      function step(index) {
        if (index >= selected.length) {
          emit({ event: 'done', passed: passed, failed: failed })
          document.getElementById('headline').textContent = failed ? 'FAILED' : 'PASSED'
          probeDeepLinks()
          return
        }

        var entry = selected[index]
        Promise.resolve()
          .then(function () { return entry.run() })
          .then(
            function (detail) { return detail ? String(detail) : '' },
            function (thrown) { return 'threw: ' + describeError(thrown).message }
          )
          .then(function (detail) {
            if (detail) failed++
            else passed++
            emit({ event: 'case', name: entry.name, status: detail ? 'fail' : 'pass', detail: detail })
            show(entry.name, !detail, detail)
            step(index + 1)
          })
      }

      step(0)
    })
  })()
  </script>
</body>
</html>
